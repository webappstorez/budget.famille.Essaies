<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotisations famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#162033; --muted:#5b687b; --line:#d8dee7;
  --ok:#17744a; --warn:#935f00; --bad:#b4261b; --info:#2a56c9;
  --ok-bg:#e4f4ec; --warn-bg:#fbf0d4; --bad-bg:#fbe5e2; --info-bg:#e6edfb;
  --m1:#0f766e; --m2:#b45309; --m3:#6d3fd6; --m4:#be185d; --m5:#1d4ed8; --m6:#4d7c0f;
  --on-m:#ffffff; --focus:#2a56c9;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1420; --surface:#171f2d; --surface-2:#1d2636; --ink:#e8ecf3; --muted:#9aa8bc; --line:#2c3749;
    --ok:#5ddc98; --warn:#f0b84a; --bad:#ff8d81; --info:#8fb0ff;
    --ok-bg:#16301f; --warn-bg:#33290f; --bad-bg:#3a1c19; --info-bg:#1a2745;
    --m1:#2dd4bf; --m2:#f59e0b; --m3:#a78bfa; --m4:#f472b6; --m5:#60a5fa; --m6:#a3e635;
    --on-m:#0e1420; --focus:#8fb0ff;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--head);font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.15}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
p{margin:.3rem 0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{padding:22px 0 12px}
.top .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(1.5rem,3.4vw,2.1rem)}
.top .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:550}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.small{padding:3px 9px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.yearbox{display:flex;align-items:center;gap:6px;font-weight:600}
.yearbox input{width:84px}
nav.tabs{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
main{padding:20px 0 60px}
.panel[hidden]{display:none}
.stack{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3+p,.card h2+p{color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
a.btn{text-decoration:none;display:inline-block}
#nc-syn .chip{white-space:nowrap}
.simgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;margin-top:8px}
.simcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}.simcard.bad{border-color:var(--bad)}
.simh{display:flex;justify-content:space-between;align-items:center;gap:8px}.simt{width:100%;border-collapse:collapse;margin-top:8px;font-size:.88rem}.simt th{text-align:right;font-weight:600;color:var(--muted,#667);padding:4px 6px;border-bottom:1px solid var(--line)}.simt td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}.simt th:first-child,.simt td:first-child{text-align:left}
.dcell{display:flex;gap:6px;align-items:center}.dcell .in{flex:1;min-width:0}
.bell{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:32px;height:32px;padding:0;cursor:pointer;font-size:1rem;line-height:1;flex:none}
.bell.on{background:var(--info-bg,#e8f0fe);border-color:var(--info,#3b6fd8)}
.bell[hidden],.dalert[hidden]{display:none}
.dalert{display:flex;gap:6px;align-items:center;margin-top:4px}.dalert .in{width:56px;text-align:center}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}

/* inputs */
.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:6px 9px;min-width:0}
.in:hover{border-color:var(--muted)}
.in[disabled]{opacity:.65;background:transparent}
.in.num{text-align:right}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink)}
.frow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;align-items:center;padding:5px 0}
.frow label{color:var(--muted)}
.frow .with-auto{display:flex;gap:8px;align-items:center}
.frow .with-auto label{white-space:nowrap;font-size:.8rem}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.sum-row b{font-weight:650}

/* hero split */
.hero{padding:22px}
.hero h2{margin-bottom:2px}
.split{display:flex;height:96px;border-radius:14px;overflow:hidden;margin:16px 0 8px;gap:3px}
.split .seg{display:flex;flex-direction:column;justify-content:center;padding:0 18px;color:var(--on-m);min-width:0;transition:flex-basis .35s}
.split .seg .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .seg .pc{font:700 clamp(1.5rem,4.6vw,2.7rem)/1 var(--head)}
.kpis{display:flex;flex-wrap:wrap;gap:8px 32px;margin-top:12px}
.kpi b{display:block;font:650 1.35rem/1.2 var(--head)}
.kpi span{color:var(--muted);font-size:.88rem}

/* member cards */
.mc{border-top:5px solid var(--c);}
.mc h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.mc dl{margin:8px 0 0;display:grid;grid-template-columns:1fr auto;gap:5px 12px}
.mc dt{color:var(--muted)}
.mc dd{margin:0;text-align:right;font-weight:600}
.mc .big{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mc .big b{font:700 1.6rem/1 var(--head)}

/* tables */
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:.86rem;white-space:nowrap}
tfoot td{font-weight:650;border-top:2px solid var(--ink);border-bottom:0}
table.grid td.l{min-width:190px;position:sticky;left:0;background:var(--surface);z-index:1}
table.grid th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
table.grid .in{min-width:62px;padding:4px 5px}
table.grid td{padding:3px 3px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.82rem;font-weight:600}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.plain{background:var(--surface-2);color:var(--muted)}
.alerts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.alerts li{padding:9px 12px;border-radius:9px;border-left:4px solid;display:flex;gap:8px}
.alerts .bad{background:var(--bad-bg);border-color:var(--bad)}
.alerts .warn{background:var(--warn-bg);border-color:var(--warn)}
.alerts .info{background:var(--info-bg);border-color:var(--info)}
.alerts .ok{background:var(--ok-bg);border-color:var(--ok)}
.bar{height:7px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:3px;min-width:70px}
.bar i{display:block;height:100%}
.cell2 small{display:block;color:var(--muted);font-size:.78rem}

/* projects */
.proj{border-left:5px solid var(--ink)}
.proj .head{display:grid;grid-template-columns:minmax(180px,2fr) minmax(130px,1fr) minmax(160px,1fr) auto;gap:10px;align-items:end}
.proj .head label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.proj table .in{padding:4px 6px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.presult{margin-top:10px;display:grid;gap:6px}
.presult .ln{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.commit{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;align-items:end}
.commit div{flex:1 1 130px}
.commit label{display:block;font-size:.8rem;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:16px}
.modal .box h3{margin:0 0 6px}.modal .vrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px dashed var(--line)}.modal .vrow small{display:block}
details.fold{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details.fold summary{cursor:pointer;font-weight:600}
.rules ol{padding-left:1.2rem;display:grid;gap:10px;max-width:78ch}
.rules li::marker{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.86rem;margin-top:6px}
@media (max-width:760px){
  .proj .head{grid-template-columns:1fr 1fr}
  .proj .head .full{grid-column:1/-1}
  .split{height:84px}
  .split .seg{padding:0 10px}
}

/* accès */
body.locked header.top,body.locked nav.tabs,body.locked main{display:none}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate[hidden]{display:none}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:14px}
.gate-card h1{font-size:1.6rem}
.gate-card form{display:grid;gap:12px}
.gate-card label,.uform label{display:grid;gap:4px;font-weight:600}
.gmsg{min-height:1.2em;color:var(--bad);font-size:.9rem}
.who{color:var(--muted);font-size:.9rem}
.uform{display:grid;gap:10px;align-content:start}
.logtable td{vertical-align:top;text-align:left}
.logtable th{text-align:left}
.logtable .t{white-space:nowrap;color:var(--muted)}
.histtable .hl{font-size:.82rem;line-height:1.35;max-width:240px;overflow-wrap:anywhere}.histtable tr.hsave td{background:color-mix(in srgb,var(--muted) 10%,transparent)}.histtable td:nth-child(3){overflow-wrap:anywhere;max-width:200px}
@media print{.gate{display:none!important}}

/* parts, paiements, échéances */
:root{--u-orange:#d9680f;--u-orange-bg:#fde6d2;--u-yellow:#946f00;--u-yellow-bg:#fbefb8;--on-u:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--u-orange:#ffa14d;--u-orange-bg:#40260f;--u-yellow:#f2d04a;--u-yellow-bg:#3a3210;--on-u:#10151f}}
.pc{display:flex;align-items:center;gap:6px}
.pc .in{width:92px}
.pc .paid{display:flex;gap:3px;align-items:center;font-size:.8rem;color:var(--muted);white-space:nowrap}
.in.auto::placeholder{color:var(--muted);opacity:1;font-style:italic}
.pt td{padding:4px 5px}
.pt td:nth-child(n+4){text-align:left}
.tipbox{position:fixed;z-index:60;max-width:min(340px,86vw);background:var(--ink);color:var(--surface);padding:9px 11px;border-radius:9px;font-size:.8rem;line-height:1.45;white-space:pre-line;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.tipbox[hidden]{display:none}
[data-tipid]:hover{cursor:help}
.stack>*,.guide>.card{min-width:0;max-width:100%}.guide .tw{max-width:100%}
.gd-lead{font-size:1.05rem;max-width:70ch}.gd-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip-wrap{border-radius:14px;padding:5px 11px;white-space:normal;line-height:1.35;text-align:left;max-width:100%}
.gd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,195px),1fr));gap:16px 12px;margin-top:18px}.gd-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.gd-card{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.gd-card h4{margin:0 0 4px;font-size:1rem}.gd-card p{margin:0 0 6px}
.gd-n{position:absolute;top:-10px;left:12px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center}.gd-grid .gd-card{padding-top:16px}
.gd-time,.gd-steps,.gd-charte{margin:8px 0;padding-left:1.3rem;display:grid;gap:8px}.gd-time{list-style:none;padding:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.gd-time li{background:var(--surface-2);border:1px solid var(--line);border-top:3px solid var(--info);border-radius:10px;padding:9px 11px;display:grid;gap:3px;font-size:.9rem}.gd-time li b{color:var(--info)}
.gd-list{margin:6px 0;padding-left:1.2rem;display:grid;gap:7px}.gd-tab td:first-child{white-space:normal}@media(max-width:600px){.gd-tab{font-size:.82rem}.gd-tab th:first-child,.gd-tab td:first-child{min-width:0}.gd-tab th,.gd-tab td{padding:6px 5px}}.guide details.fold p{margin:6px 0 2px}
.tip{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;margin-left:5px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font:700 .7rem/1 var(--body);font-style:normal;cursor:help;vertical-align:middle;user-select:none}.tip:hover,.tip:focus-visible{background:var(--info);border-color:var(--info);color:#fff;outline:none}
.dues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.dues li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.u-late{--ua:var(--bad);--ub:var(--bad-bg);--ud:.7s}
.u-red{--ua:var(--bad);--ub:var(--bad-bg);--ud:.95s}
.u-orange{--ua:var(--u-orange);--ub:var(--u-orange-bg);--ud:1.4s}
.u-cap{--ua:var(--bad);--ub:var(--bad-bg);--ud:.8s}
.u-yellow{--ua:var(--u-yellow);--ub:var(--u-yellow-bg);--ud:2s}
.chip.u{background:var(--ub);color:var(--ua);animation:ublink var(--ud) ease-in-out infinite}
@keyframes ublink{0%,100%{background:var(--ub);color:var(--ua)}50%{background:var(--ua);color:var(--on-u)}}
tr[class*="u-"]>td{animation:urow calc(var(--ud)*1.6) ease-in-out infinite}
@keyframes urow{0%,100%{background:transparent}50%{background:var(--ub)}}
.proj[class*="u-"]{border-left-color:var(--ua);animation:uborder var(--ud) ease-in-out infinite}
@keyframes uborder{0%,100%{border-left-color:var(--ua)}50%{border-left-color:var(--ub)}}
.capalert{border-left:4px solid var(--ua);animation:uborder var(--ud) ease-in-out infinite}
dd.low,small.low{color:var(--bad);font-weight:700}
@media (prefers-reduced-motion:reduce){
  .chip.u,tr[class*="u-"]>td,.proj[class*="u-"],.capalert{animation:none!important}
  tr[class*="u-"]>td{background:var(--ub)}
}
.short{color:var(--bad)}table.grid th.short{animation:ublink .8s ease-in-out infinite;--ua:var(--bad);--ub:var(--bad-bg)}
@media (prefers-reduced-motion:reduce){table.grid th.short{animation:none;background:var(--bad-bg)}}
.in.over{border-color:var(--bad)!important;background:var(--bad-bg)}
.in.svin{min-width:88px;width:100%}.in.svin{font-size:.86rem;padding-inline:6px}.btn.mk{display:block;width:100%;margin-top:3px;font-size:.7rem;padding:2px 4px;line-height:1.3}@media(max-width:600px){table.bil{font-size:.76rem}table.bil th,table.bil td{padding:6px 4px}table.bil th:first-child,table.bil td:first-child{width:92px;min-width:0!important;max-width:92px;white-space:normal}table.bil td small{display:none!important}table.bil .chip{font-size:.68rem;padding:2px 6px;white-space:normal}}.in.svin.est{font-style:italic;border-style:dashed;background:var(--info-bg)}.in.svin.miss{border-color:var(--warn)}table.grid th.pre,table.grid td.pre{background:var(--surface-2,var(--surface));opacity:.96}table.grid th.cut,table.grid th.calhd{border-left:2px solid var(--line,#8884)}.calhd small{font-weight:400}.stk1,table.grid th.stk1{position:sticky;left:0;z-index:3;background:var(--surface);min-width:92px;width:92px;max-width:92px}
.stk2,table.grid th.stk2{position:sticky;left:92px;z-index:3;background:var(--surface);min-width:168px;box-shadow:2px 0 0 var(--line)}
table.grid th.stk1{z-index:4}
#p-cc table.grid th:nth-child(1),#p-cc table.grid td:nth-child(1){min-width:190px;width:190px;max-width:190px}
#p-cc table.grid th:nth-child(2),#p-cc table.grid td:nth-child(2){position:sticky;left:190px;z-index:2;background:var(--surface);min-width:118px;box-shadow:2px 0 0 var(--line)}
#p-cc table.grid th:nth-child(1),#p-cc table.grid th:nth-child(2){z-index:4}
#p-cc table.grid td:nth-child(n+3) .in{min-width:78px}
.sv1>td{border-top:2px solid var(--line)}.svnote{display:block;font-size:.7rem;font-weight:400;opacity:.85;line-height:1.2}
.svl{white-space:nowrap;color:var(--muted);font-size:.82rem}table.grid td.svc{text-align:right;font-variant-numeric:tabular-nums;font-size:.86rem;white-space:nowrap}table.grid th.now,table.grid td.now{background:var(--info-bg)}
:root{--v1:#2a78d6;--v2:#eb6834;--v3:#1baf7a;--vgrid:#e3e8ef;--vneu:#b6c0cd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--v1:#3987e5;--v2:#d95926;--v3:#199e70;--vgrid:#2c3749;--vneu:#55637a}}
:root[data-theme="dark"]{--v1:#3987e5;--v2:#d95926;--v3:#199e70;--vgrid:#2c3749;--vneu:#55637a}
.vcard.vwide{grid-column:1/-1}.vmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}.vsub h4{margin:6px 0 2px;font-size:1rem}.vsub>p{margin:0 0 6px}
table.vmt{margin-top:12px;font-size:.9rem}.vmt th,.vmt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.vmt th:first-child,.vmt td:first-child{text-align:left;white-space:normal;min-width:150px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.vcard h3{margin:0 0 2px}.vcard>p{margin:0 0 8px}.vbox{min-width:0}
svg.vz{display:block;width:100%;height:auto;overflow:visible}
svg.vz .vt{fill:var(--muted);font-size:11px;font-family:var(--body)}
svg.vz .vtl{fill:var(--ink)}svg.vz .vtv{fill:var(--ink);font-weight:600}svg.vz .vtin{fill:#fff;font-weight:600}svg.vz .vtdk{fill:var(--ink);font-weight:600}svg.vz .vhalo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}svg.vz .vhi{fill:var(--ink);font-weight:700}
svg.vz .vg{stroke:var(--vgrid);stroke-width:1}svg.vz .vz0{stroke:var(--muted);stroke-opacity:.55}

let state=load()||defaults();
function load(){try{const s=localStorage.getItem(KEY);if(!s)return null;const o=JSON.parse(s);return o&&o.members?o:null}catch(e){return null}}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{let j=null;try{j=JSON.stringify(state);localStorage.setItem(KEY,j)}catch(e){}if(j&&typeof cloudMark==='function')cloudMark(j)},250)}

/* ============ Calcul ============ */
function memberBase(m){
  const dedV=m.dedAuto?Math.round(num(m.sal)*0.10):num(m.ded);
  const abV=m.abatAuto?Math.round(num(m.bnc)*0.34):num(m.abat);
  const salNet=Math.max(0,num(m.sal)-dedV);
  const bncNet=Math.max(0,num(m.bnc)-abV);
  const official=salNet+num(m.autres)+bncNet;
  const nonoffV=num(m.nonoff);
  const total=official+nonoffV;
  const adj=false;
  const used=total;
  const deds=sum((m.deds||[]).map(d=>num(d.a)));
  const base=Math.max(0,used-deds);
  return {m,dedV,abV,salNet,bncNet,official,nonoffV,total,adj,used,deds,base};
}
function edf(jobs,L,S,H,ceil){
  const rem=jobs.map(j=>j.need),done=jobs.map(j=>j.need<=1e-9?S:Infinity);
  const alloc=jobs.map(()=>new Array(H).fill(0));
  const order=jobs.map((_,k)=>k).sort((a,b)=>jobs[a].idx-jobs[b].idx);
  for(let t=0;t<H;t++){
    let av=ceil?Math.min(L,ceil[t]==null?L:ceil[t]):L;
    for(const k of order){
      if(rem[k]<=1e-9||jobs[k].start>S+t)continue;
      const take=Math.min(av,rem[k]);
      if(take>0){alloc[k][t]=take;rem[k]-=take;av-=take}
      if(rem[k]<=1e-9&&done[k]===Infinity)done[k]=S+t;
      if(av<=1e-12)break;
    }
  }
  return {alloc,done};
}
// paiement unique à l’échéance : chaque part est versée en une fois le mois de sa date (pas d’étalement)
function dueSchedule(jobs,S,H,ceil){
  const alloc=jobs.map(()=>new Array(H).fill(0)),done=jobs.map(()=>S),tot=new Array(H).fill(0);
  jobs.forEach((j,k)=>{if(j.need<=1e-9)return;const t=j.idx-S;if(t<0||t>=H){done[k]=j.idx;return}alloc[k][t]=j.need;tot[t]+=j.need;done[k]=j.idx});
  let feasible=true;
  jobs.forEach((j,k)=>{if(j.need<=1e-9)return;const t=j.idx-S;if(t>=0&&t<H&&tot[t]>(ceil[t]||0)+0.5){done[k]=Infinity;feasible=false}});
  return {L:Math.max(0,...tot),feasible,alloc,done};
}
function planMember(jobs,cap,S,H,ceil){
  if(!jobs.length)return {L:0,feasible:true,alloc:[],done:[]};
  const ok=r=>r.done.every((d,k)=>d<=jobs[k].idx);
  let r=edf(jobs,cap,S,H,ceil);
  if(!ok(r))return {L:cap,feasible:false,...r};
  let lo=0,hi=cap;
  for(let it=0;it<48;it++){const mid=(lo+hi)/2;ok(edf(jobs,mid,S,H,ceil))?hi=mid:lo=mid}
  r=edf(jobs,hi,S,H,ceil);
  return {L:hi,feasible:true,...r};
}
const BAREME=[[11600,0],[29579,.11],[84577,.30],[181917,.41],[1e12,.45]];
function impotParts(q){let t=0,p=0;for(const [lim,r] of BAREME){if(q>p)t+=(Math.min(q,lim)-p)*r;p=lim;if(q<=lim)break}return t}
function estimNet(R,S){
  // Net estimé = revenu de référence (réintégré des abattements fiscaux non monétaires)
  //              − cotisations salariales estimées (salariés seulement) − part de l’impôt du foyer.
  // BNC : l’abattement et l’URSSAF sont saisis par l’utilisateur (déductions), ils ne sont pas réestimés.
  const parts=Math.max(1,blank(S.rules.parts)?3:num(S.rules.parts));
  R.mem.forEach(x=>{
    const m=x.m;
    x.socRate=blank(m.tauxSal)?0.152:Math.max(0,num(m.tauxSal))/100;
    x.cotisSal=num(m.sal)*x.socRate;
    const sn=Math.max(0,num(m.sal)-x.cotisSal);
    x.salTaxable=Math.max(0,sn-(m.dedAuto?Math.round(sn*0.10):num(m.ded)));
    x.taxable=x.salTaxable+num(m.autres)+x.bncNet;
  });
  const T=sum(R.mem.map(x=>x.taxable)),tax=parts*impotParts(T/parts);
  R.impot=tax;R.parts=parts;R.sumTaxable=T;
  R.mem.forEach(x=>{
    const imp=T>0?tax*x.taxable/T:0;
    x.cashRef=x.base+x.dedV+x.abV;
    x.netAuto=Math.max(0,x.cashRef-x.cotisSal-imp)/12;
    x.netInfo={base:x.base,dedV:x.dedV,abV:x.abV,cotis:x.cotisSal,imp,taxable:x.taxable};
    x.netMonth=blank(x.m.netOverride)?x.netAuto:Math.max(0,num(x.m.netOverride));
  });
}
const LEVEL_RANK={late:4,red:3,orange:2,yellow:1};
function compute(S){
  const R={S};
  const n=S.members.length;
  R.mem=S.members.map(memberBase);
  R.sumBase=sum(R.mem.map(x=>x.base));
  R.mem.forEach(x=>x.pct=R.sumBase>0?x.base/R.sumBase:1/n);
  estimNet(R,S);
  // régularisation de l'année précédente (malus / bonus)
  const a0=blank(S.rules.annee0)?2026:num(S.rules.annee0);
  R.reg={a0,mode:'zero',V:0};
  R.mem.forEach(x=>{x.regTotal=0;x.regMonth=0;x.regRow=null});
  if(S.year>a0){
    const pv=S.prev,ry=S.revYear==null?S.year-1:S.revYear;
    if(!pv||num(pv.year)!==S.year-1)R.reg.mode='missing';
    else if(ry<S.year-1)R.reg.mode='pending';
    else{
      R.reg.mode='ok';
      const net=R.mem.map(x=>num((pv.paid||{})[x.m.id])-num((pv.applied||{})[x.m.id]));
      const V=sum(net);R.reg.V=V;
      const NCt=num(pv.ncTotal);R.reg.NC=NCt;
      const TT=blank(pv.charges)?Math.max(0,V-NCt):num(pv.charges);R.reg.T=TT;R.reg.noT=blank(pv.charges);
      R.mem.forEach((x,i)=>{const dueCc=x.pct*TT,dueNc=x.pct*NCt,due=dueCc+dueNc,ecart=net[i]-due;
        x.regRow={paid:num((pv.paid||{})[x.m.id]),applied:num((pv.applied||{})[x.m.id]),net:net[i],due,dueCc,dueNc,ecart};
        x.regTotal=-ecart;x.regMonth=x.regTotal/12});
    }
  }
  // charges mensuelles récurrentes
  R.ccMonths=[...Array(12)].map((_,k)=>sum(S.cc.lines.map(l=>num(l.m[k]))));
  R.T=sum(R.ccMonths);
  // plafond de contribution : un membre ne verse pas plus que son plafond mensuel, les autres couvrent la différence (au prorata de leur part)
  R.mem.forEach(x=>{const q=(S.prevPct||{})[x.m.id];x.pctPrev=blank(q)||!isFinite(num(q))?x.pct:num(q);x.pctKnown=!blank(q)&&isFinite(num(q))});
  R.mem.forEach((x,i)=>{x.ix=i;x.plaf=blank(x.m.plafond)?Infinity:Math.max(0,num(x.m.plafond));
    const d0=ymIdx(x.m.plafondDebut),d1=ymIdx(x.m.plafondFin);x.pf0=d0==null?-Infinity:d0;x.pf1=d1==null?Infinity:d1;x.ccByMonth=[]});
  // plafond du membre pour le mois idx (début et fin inclus ; sans début ni fin il s’applique toujours)
  const plafAt=(x,idx)=>x.pf0<=idx&&idx<=x.pf1?x.plaf:Infinity;
  const alCache={};
  R.allocAt=idx=>{
    if(alCache[idx])return alCache[idx];
    const v=R.ccMonths[((idx%12)+12)%12],pre=idx<yStart(S.year),pp=R.mem.map(x=>pre?x.pctPrev:x.pct),c=R.mem.map((x,i)=>v*pp[i]),fix=R.mem.map(()=>false),pl=R.mem.map(x=>plafAt(x,idx));
    for(let it=0;it<=R.mem.length;it++){
      const fs=sum(c.filter((_,i)=>fix[i])),free=R.mem.map((_,i)=>i).filter(i=>!fix[i]),ws=sum(free.map(i=>pp[i]));
      free.forEach(i=>{c[i]=ws>0?(v-fs)*pp[i]/ws:(v-fs)/free.length});
      const nf=free.filter(i=>c[i]>pl[i]+1e-9);
      if(!nf.length)break;
      nf.forEach(i=>{fix[i]=true;c[i]=pl[i]});
    }
    return alCache[idx]={c,unc:Math.max(0,v-sum(c))};
  };
  R.uncov=BM.map((k,j)=>{const a=R.allocAt(yStart(S.year)+j);R.mem.forEach((x,i)=>x.ccByMonth[k]=a.c[i]);return a.unc});
  R.mem.forEach(x=>{
    x.ccYear=sum(x.ccByMonth); x.ccMonth=x.ccYear/12;
    x.plafDiff=x.ccYear-x.pct*R.T; // < 0 : plafond atteint ; > 0 : couvre la part d’un autre
    x.avail=x.base/12-x.ccMonth;
  });
  R.uncovTotal=sum(R.uncov);
  R.start=Math.max(NOW_IDX+1,yStart(S.year)); // les paiements à l’échéance commencent le mois prochain (ou en mai si le budget n’a pas commencé)
  const H=48; R.H=H;
  R.todayMs=TODAY0;
  R.minNet=blank(S.rules.minNet)?1000:num(S.rules.minNet); // valeur par défaut, si un membre n’a pas défini son propre reste à garder
  R.mem.forEach(x=>{x.minNet=blank(x.m.minKeep)?R.minNet:Math.max(0,num(x.m.minKeep))});
  // capacité = potentiel mensuel : net estimé − virement mensuel le plus élevé − reste à garder (seuil)
  R.mem.forEach(x=>{
    x.virAvg=sum([...Array(12)].map((_,t)=>monthCc(x,R,t)+monthReg(x,R,t)))/12;
    x.ccAvg=sum([...Array(12)].map((_,t)=>monthCc(x,R,t)))/12;x.regAvg=x.virAvg-x.ccAvg;
    // au pire : le virement mensuel le plus élevé (charges mensuelles récurrentes + régularisation) sur les 12 mois passés et les 12 mois à venir
    x.virMax=-Infinity;x.virMaxT=0;for(let t=-12;t<12;t++){const v=monthCc(x,R,t)+monthReg(x,R,t);if(v>x.virMax+0.005){x.virMax=v;x.virMaxT=t}}
    x.ccMax=monthCc(x,R,x.virMaxT);x.regMax=x.virMax-x.ccMax;
    x.keepAvg=x.netMonth-x.virMax;
    x.potential=Math.max(0,x.keepAvg-x.minNet);
    x.capAuto=x.potential;
    x.capMode=!blank(x.m.capOverride)?'eur':!blank(x.m.capPct)?'pct':'auto';
    x.capPctV=x.capAuto*Math.max(0,num(x.m.capPct))/100;
    x.cap=x.capMode==='eur'?Math.max(0,num(x.m.capOverride)):x.capMode==='pct'?x.capPctV:x.capAuto;
  });
  {const nowJ=NOW_IDX-yStart(S.year);
  R.cover=[...Array(12)].map((_,j)=>{const cc=R.ccMonths[BM[j]];
    const vals=S.members.map(m=>(S.suivi[m.id]||[])[j]);
    const entered=vals.filter(v=>!blank(v)),paid=sum(entered.map(num));
    const all=vals.length>0&&entered.length===vals.length,check=all; // alerte seulement quand le versement de chaque membre est validé comme payé
    return {j,cc,paid,all,check,short:check&&paid<cc-0.5,gap:paid-cc}});}
  R.close={days:Math.round((new Date(S.year+1,4,1).getTime()-TODAY0)/86400000)};
  R.mem.forEach(x=>{
    x.ceil=Array.from({length:H},(_,t)=>Math.max(0,x.netMonth-x.minNet-monthCc(x,R,t)-monthReg(x,R,t))); // mois par mois : net − virement − reste minimal à garder
    x.floorBreak=[];
    for(let t=0;t<12;t++){const keep=x.netMonth-monthCc(x,R,t)-monthReg(x,R,t);if(keep<x.minNet-0.5)x.floorBreak.push({t,keep})}
  });
  R.alerte=45; // délai d’alerte avant la clôture du budget (les échéances ont leur propre alerte)
  // projets et dépenses
  const allJobs=[];let g=0;
  R.proj=S.projects.map(p=>{
    const pi=ymIdx(p.planned);
    const pr={p,total:0,gidx:[],firstIdx:null,lines:[],unpaid:R.mem.map(()=>0),paid:R.mem.map(()=>0),parts:R.mem.map(()=>0),level:null,minDays:null};
    p.lines.forEach(l=>{
      const amt=num(l.amount);
      const fixed=S.members.map(m=>{const v=(l.parts||{})[m.id];return blank(v)?null:num(v)});
      const F=sum(fixed.map(v=>v==null?0:v));
      const blanks=fixed.map((v,i)=>v==null?i:-1).filter(i=>i>=0);
      const rem=Math.max(0,amt-F);
      const bw=0;
      const parts=fixed.map(v=>v!=null?v:0); // les parts sont saisies à la main : une part vide compte pour 0 €
      const sumParts=sum(parts),gap=amt-sumParts;
      const paid=S.members.map(m=>l.paid&&l.paid[m.id]===true);
      const unpaid=parts.map((v,i)=>paid[i]?0:v);
      const un=sum(unpaid);
      const di=ymIdx((l.date||'').slice(0,7));
      let days=null;
      if(l.date){const d=new Date(l.date+'T00:00:00');if(!isNaN(d))days=Math.round((d.getTime()-TODAY0)/86400000)}
      const alertDays=blank(l.alertDays)?null:Math.max(0,Math.round(num(l.alertDays))),alertOn=alertDays!=null&&alertDays>0&&days!=null;
      let level=null;
      if(un>0.005&&days!=null){
        if(days<0)level='late';
        else if(alertOn&&days<=alertDays)level=days<=7?'red':days<=21?'orange':'yellow';
      }
      const li={l,amt,fixed,F,blanks,bw,rem,parts,sumParts,gap,paid,unpaid,un,days,level,di,alertDays,alertOn};
      pr.lines.push(li);pr.total+=amt;
      parts.forEach((v,i)=>{pr.parts[i]+=v;if(paid[i])pr.paid[i]+=v;else pr.unpaid[i]+=v});
      if(level){
        if(!pr.level||LEVEL_RANK[level]>LEVEL_RANK[pr.level])pr.level=level;
        if(pr.minDays==null||days<pr.minDays)pr.minDays=days;
      }
      if(di!=null&&amt&&(pr.firstIdx==null||di<pr.firstIdx))pr.firstIdx=di;
      if(di!=null&&un>0.005){
        const idx=Math.max(di,R.start);
        const j={pr,li,idx,start:Math.max(R.start,pi==null?R.start:pi),need:unpaid,g:g++};
        pr.gidx.push(j.g);allJobs.push(j);
      }
    });
    pr.rest=sum(pr.unpaid);
    // règle de planification : à titre informatif seulement (n’entre dans aucun calcul ni alerte)
    if(pi==null) pr.rule={kind:'info',text:'Date d’inscription au budget à renseigner'};
    else if(pr.firstIdx==null) pr.rule={kind:'info',text:'Date de paiement à renseigner'};
    else{const gap=Math.max(0,pr.firstIdx-pi);pr.rule={kind:'plain',text:'Inscrit '+gap+' mois avant le premier paiement'}}
    pr.planIdx=pi;
    return pr;
  });
  R.jobs=allJobs;
  // plan de provision, membre par membre
  R.mem.forEach((x,i)=>{
    const jj=allJobs.map(j=>({idx:j.idx,start:j.start,need:j.need[i]}));
    x.schProp=dueSchedule(jj,R.start,H,x.ceil);
    x.propProv=Array.from({length:H},(_,t)=>sum(x.schProp.alloc.map(a=>a[t]||0)));
    x.retained=Array(H).fill(null); // plus de plan à valider : l’étalement est celui proposé par l’outil
    x.hasOv=x.retained.some(v=>v!=null);
    x.prov=x.propProv.map((v,t)=>x.retained[t]!=null?x.retained[t]:v);
    x.sch=x.hasOv?{...edf(jj,1e12,R.start,H,x.prov),L:Math.max(0,...x.prov),feasible:true}:x.schProp;
    x.diffs=x.retained.filter((v,t)=>v!=null&&Math.abs(v-x.propProv[t])>0.5).length;
    x.over=x.prov.map((v,t)=>v>Math.max(0,x.netMonth-x.minNet-monthCc(x,R,t)-monthReg(x,R,t))+0.5?t:-1).filter(t=>t>=0); // analyse mois par mois
  });
  R.planOv=R.mem.some(x=>x.hasOv);
  allJobs.forEach(j=>{R.mem.forEach((x,i)=>{if(j.need[i]>1e-9&&x.sch.done[j.g]>j.idx){j.li.capLate=true}})});
  R.mem.forEach(x=>{
    x.ncByJ=[...Array(12)].map((_,j)=>{const t=yStart(S.year)+j-R.start;return t>=0&&t<H?x.prov[t]:0});
    const fz=(S.ncFrozen||{})[x.m.id]||{};
    x.ncUsed=x.ncByJ.map((v,j)=>fz[j]!=null?fz[j]:v);
    x.dueM=x.ncUsed.map((n,j)=>x.ccByMonth[BM[j]]+x.regMonth); // virement mensuel : charges mensuelles récurrentes + régularisation (les charges non courantes sont versées à part)
  });
  R.cover.forEach(c=>{c.nc=sum(R.mem.map(x=>x.ncUsed[c.j]));c.need=c.cc;c.gapNc=0;c.shortNc=false});
  R.proj.forEach(pr=>{
    pr.mres=R.mem.map((x,i)=>{
      let tot=0,first=null,last=null,done=-Infinity,need=0,deadline=-Infinity,late=false;
      pr.gidx.forEach(g=>{
        const a=x.sch.alloc[g]||[];
        a.forEach((v,t)=>{if(v>1e-9){tot+=v;if(first==null||t<first)first=t;if(last==null||t>last)last=t}});
        const j=allJobs[g];need+=j.need[i];
        const d=x.sch.done[g];if(d>done)done=d;if(j.idx>deadline)deadline=j.idx;
        if(d>j.idx&&j.need[i]>1e-9)late=true;
      });
      return {tot,first,last,done,need,deadline,late};
    });
    pr.late=pr.mres.some(r=>r.late);
    pr.completion=pr.gidx.length?Math.max(...pr.mres.map(r=>r.done)):null;
  });
  R.restTotal=sum(R.proj.map(p=>p.rest));
  R.lateCount=R.proj.filter(p=>p.late).length;
  R.capProj=R.proj.filter(p=>p.late);
  R.lastT=Math.max(-1,...R.mem.map(x=>{let l=-1;x.prov.forEach((v,t)=>{if(v>1e-9)l=t});return l}));
  // restes à payer et échéances
  R.owed=R.mem.map(()=>0);R.overdue=R.mem.map(()=>0);R.next=R.mem.map(()=>null);R.due=[];
  R.proj.forEach((pr,pi)=>pr.lines.forEach((li,lj)=>{
    li.unpaid.forEach((v,i)=>{
      if(v<=0.005)return;
      R.owed[i]+=v;if(li.level==='late')R.overdue[i]+=v;
      if(li.days!=null&&(!R.next[i]||li.days<R.next[i].days))R.next[i]={days:li.days,date:li.l.date,amt:v,label:li.l.label,proj:pr.p.name};
    });
    if(li.level)R.due.push({pr,li,pi,lj});
  }));
  R.due.sort((a,b)=>a.li.days-b.li.days);
  return R;
}

function ncPartsCal(R,Y){return R.mem.map((x,i)=>{let t=0;R.proj.forEach(pr=>pr.lines.forEach(li=>{const d=li.l.date;if(d&&+String(d).slice(0,4)===Y)t+=li.parts[i]||0}));return t})}
function ncTotalCal(R,Y){let t=0;R.proj.forEach(pr=>pr.lines.forEach(li=>{const d=li.l.date;if(d&&+String(d).slice(0,4)===Y)t+=li.amt||0}));return t}
// bilan de l’année civile en cours (janvier à décembre) : ce qui sera comparé au 1er mai suivant
function calBilan(R){
  const Y=state.year,nowJ=NOW_IDX-yStart(Y),NC=ncTotalCal(R,Y),T=R.T,tot=T+NC;
  const RN=ensureRevNext(),nb=RN.ok?nextBases():null,sB=nb?sum(nb.map(b=>b.base)):0,ncP=ncPartsCal(R,Y);
  const rows=R.mem.map(x=>{
    const v=state.suivi[x.m.id]||[],e=(state.est&&state.est[x.m.id])||[];
    let real=0,est=0,nr=0,ne=0,miss=0;
    janM(x.m.id).forEach(a=>{if(!blank(a)){real+=num(a);nr++}else miss++});
    for(let j=0;j<8;j++){if(!blank(v[j])){real+=num(v[j]);nr++}else{est+=blank(e[j])?x.dueM[j]:num(e[j]);ne++;if(j<nowJ)miss++}}
    const bs=nb?nb[R.mem.indexOf(x)].base:x.base,pct=nb&&sB>0?bs/sB:x.pct;
    const applied=num(((state.janApr||{}).applied||{})[x.m.id])+8*x.regMonth,ncp=ncP[R.mem.indexOf(x)],paid=real+est-applied+ncp,due=pct*tot,diff=paid-due;
    return {x,base:bs,pct,real,est,nr,ne,miss,applied,ncp,paid,due,diff,result:-diff,monthly:-diff/12};
  });
  return {Y,T,NC,tot,rows,rvOk:!!nb,miss:sum(rows.map(r=>r.miss)),est:sum(rows.map(r=>r.ne))};
}

// ===== Rappels iPhone : raccourcis « Ajouter rappel » et « Supprimer rappel » =====
// Ajouter rappel : ligne 1 = titre, une date détectée dans le texte = une alerte (UN SEUL rappel par exécution, donc une seule date dans le texte).
// Supprimer rappel : un titre par ligne, supprime les rappels non terminés portant exactement ce titre.
const FR_M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function remDate(li){const d=new Date(li.l.date+'T00:00:00');d.setDate(d.getDate()-(li.alertDays||0));if(d.getTime()<TODAY0)d.setTime(TODAY0);
  const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function remFr(iso){const [y,m,d]=iso.split('-').map(Number);return `${d} ${FR_M[m-1]} ${y} à 09:00`}
// le raccourci détecte toute date du texte : on neutralise mois, jours et années dans le titre
function noDate(t){return String(t||'').replace(/(?<![\p{L}])(janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre|janv|févr|fevr|avr|juil|sept|oct|nov|déc|dec|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|demain|hier|aujourd)(?![\p{L}])/giu,m=>m[0]+'‌'+m.slice(1))
  .replace(/(\d)[\/.\-:h](?=\d)/g,'$1 ').replace(/\b(19|20)(\d\d)\b/g,'$1‌$2').replace(/\s*\n\s*/g,' ').trim()}
function remTitleOf(pr,li){return noDate(`Charge non courante – ${li.l.label||'dépense'} (${pr.p.name})`)}
function remKeyOf(li,pr){pr=pr||(window.__R.proj.find(p=>p.lines.includes(li)));return remDate(li)+'|'+remTitleOf(pr,li)}
function remPlan(R,onlyId,gone){
  const dels=[],adds=[];
  if(!gone)R.proj.forEach(pr=>pr.lines.forEach(li=>{
    const l=li.l,id='cf-'+l.id;if(onlyId&&id!==onlyId)return;
    const want=li.alertOn&&li.un>0.005&&li.days>=0;
    if(want){const key=remKeyOf(li,pr),title=remTitleOf(pr,li);
      if(l.remKey&&l.remKey!==key)dels.push({id,title:l.remTitle||''});
      else if(!l.remKey)adds.push({id,title,date:remDate(li),key})}
    else if(l.remKey)dels.push({id,title:l.remTitle||''})}));
  (state.remDel||[]).forEach(o=>{if(o&&o.id&&(!onlyId||o.id===onlyId))dels.push({id:o.id,title:o.title||''})});
  return {dels,adds}}
const REM_IOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function remHref(name,text){let h='shortcuts://x-callback-url/run-shortcut?name='+encodeURIComponent(name)+'&input=text&text='+encodeURIComponent(text);
  if(/^https?:/.test(location.protocol))h+='&x-success='+encodeURIComponent(location.href.split('#')[0]);return h}
// prochaine étape : suppression d’abord, puis création (un seul rappel par exécution)
function remStep(R,onlyId,gone){
  const P=remPlan(R,onlyId,gone),nA=SHORTCUT_ADD,nD=SHORTCUT_DEL;
  if(P.dels.length){const titles=P.dels.filter(d=>d.title).map(d=>d.title),st={kind:'del',items:P.dels.map(d=>({id:d.id}))};
    if(!titles.length){st.skip=true;return st}
    if(!nD)return null;st.href=remHref(nD,titles.join('\n'));return st}
  if(P.adds.length){const a=P.adds[0];if(!nA)return null;
    return {kind:'add',items:[{id:a.id,key:a.key,title:a.title}],href:remHref(nA,a.title+'\n'+remFr(a.date))}}
  return null}
function remCommit(st){
  const each=f=>state.projects.forEach(p=>p.lines.forEach(f));
  if(st.kind==='del')st.items.forEach(o=>{state.remDel=(state.remDel||[]).filter(x=>x.id!==o.id);each(l=>{if('cf-'+l.id===o.id){l.remKey='';l.remTitle=''}})});
  else st.items.forEach(o=>each(l=>{if('cf-'+l.id===o.id){l.remKey=o.key;l.remTitle=o.title}}))}
// lance le raccourci (geste de l’utilisateur) ; l’état est enregistré tout de suite, sans confirmation
function remGo(onlyId,gone){
  const st=remStep(window.__R,onlyId,gone);if(!st)return false;
  if(st.skip){remCommit(st);refresh();return true}
  if(!REM_IOS())return false;
  remCommit(st);save();refresh();location.href=st.href;return true}
function remLineHtml(R,pr,li){
  const l=li.l,want=li.alertOn&&li.un>0.005&&li.days>=0,st=remStep(R,'cf-'+l.id),ios=REM_IOS();
  const btn=lab=>ios?` <button type="button" class="btn small" data-act="remLine" data-pi="${R.proj.indexOf(pr)}" data-li="${pr.lines.indexOf(li)}">${lab}</button>`:' <span class="muted">(à faire depuis l’iPhone)</span>';
  if(want){const rd=remDate(li);
    if(st&&st.kind==='add'&&!l.remKey)return `rappel à envoyer (${esc(fdate(rd))})`+btn('Envoyer');
    if(st)return `rappel à mettre à jour (${esc(fdate(rd))})`+btn('Mettre à jour');
    return `rappel le ${esc(fdate(rd))}`}
  if(li.alertOn&&li.days<0&&li.un>0.005)return 'Échéance dépassée';
  if(li.alertOn&&li.un<=0.005)return li.amt>0?'Tout payé : pas d’alerte':'Saisissez un montant : le rappel sera créé ensuite';
  if(l.remKey)return 'rappel à supprimer'+btn('Supprimer');
  return ''}

const fnum=v=>String(Math.round(v*100)/100).replace('.',',');

/* Explications affichées au survol : texte calculé à la demande avec les valeurs actuelles */
const DEF_CC='Charges mensuelles récurrentes : charges récurrentes mensuelles et obligatoires.';
const DEF_NC='Charges non courantes : dépenses non obligatoires, décidées par la famille.';
function defNet(){const R=window.__R;return 'Net estimé : ce que chacun reçoit chaque mois, calculé à partir de son revenu de référence.\nRevenu de référence (abattements fiscaux réintégrés) − cotisations salariales estimées'+(R?' (taux propre à chaque profil, '+R.mem.map(x=>x.m.name+' '+(x.socRate*100).toLocaleString('fr-FR',{maximumFractionDigits:1})+' %').join(', ')+' du salaire brut : retraite, santé, CSG… ; appliqué aux salaires seulement, pas au BNC)':'')+' − sa part de l’impôt du foyer'+(R?' ('+R.parts+' parts, barème progressif)':'')+', le tout divisé par 12.\nPour le BNC, l’abattement et l’URSSAF sont saisis par l’utilisateur.\nC’est une estimation : la fiche Revenus N-1 permet de saisir le net réel, qui la remplace.\nCe que le virement au budget ne consomme pas reste sur le compte et sert aux dépenses personnelles.'}
function defRef(){return 'Revenu de référence : le revenu déclaré de l’année précédente (salaires après déduction de 10 %, BNC après abattement, autres revenus, revenus non officiels), diminué des déductions saisies et corrigé de la régularisation de revenu éventuelle.\nC’est la base de calcul des cotisations : la part de chacun = son revenu de référence ÷ le total du foyer, appliquée au total des charges mensuelles récurrentes. Les statistiques d’effort sont exprimées dans cette même base.'}
function tipText(id){
  const p=id.split(':'),k=p[0],w=p[1];
  if(k==='def')return w==='cc'?DEF_CC:w==='net'?defNet():w==='ref'?defRef():DEF_NC;
  const t=tipTextCore(id);if(!t)return t;
  const cc=k==='av'||(k==='syn'&&['ccY','ccM','virt'].includes(w));
  const nc=['part','line','proj','rule','prov','plan','owed','cap'].includes(k)||(k==='syn'&&['prov','virt'].includes(w));
  return t+(cc?'\n\n'+DEF_CC:'')+(nc?'\n\n'+DEF_NC:'');
}
function tipTextCore(id){
  const R=window.__R;if(!R)return '';
  const p=id.split(':'),k=p[0],M=i=>R.mem[+i];
  try{switch(k){
    case 'capvir':{const x=M(p[1]);return `Virement mensuel le plus élevé de ${x.m.name}, en retenant le pire mois parmi les 12 passés et les 12 à venir : ${idxLabel(R.start+x.virMaxT)}.\ncharges mensuelles récurrentes ${eur0(x.ccMax)}${Math.abs(x.regMax)>0.5?`\n+ régularisation ${sgn(x.regMax,eur0)}`:''}\n= ${eur0(x.virMax)}.\nLes charges non courantes ne sont pas comprises : elles se paient à part.`}
    case 'capkeep':{const x=M(p[1]);return `Net estimé ${eur0(x.netMonth)} − virement le plus élevé ${eur0(x.virMax)} (${idxLabel(R.start+x.virMaxT)}) = ${eur0(x.keepAvg)} par mois pour les dépenses personnelles de ${x.m.name} au pire, avant les charges non courantes.`}
    case 'av':{const x=M(p[1]);return `Reste disponible de ${x.m.name} par mois :\nrevenu de référence ${eur0(x.base)} ÷ 12 = ${eur0(x.base/12)}\n− cotisation moyenne aux charges mensuelles récurrentes ${eur2(x.ccMonth)}\n= ${eur0(x.avail)}.`}
    case 'cap':{const x=M(p[1]);return x.capMode==='pct'?`Capacité imposée à ${num(x.m.capPct)} % du potentiel mensuel : ${eur0(x.capAuto)} × ${num(x.m.capPct)} % = ${eur0(x.cap)} par mois.`:x.capMode==='auto'
      ?`Potentiel mensuel = reste pour dépenses personnelles au pire ${eur0(x.keepAvg)} − reste à garder ${eur0(x.minNet)} = ${eur0(x.capAuto)} par mois (zéro s’il reste moins que le seuil).\nLe mois d’une échéance, les parts à payer ne doivent pas dépasser ce qui reste du net estimé (${eur0(x.netMonth)}) après la cotisation aux charges mensuelles récurrentes, au-delà du reste à garder.`
      :`Capacité fixée à la main : ${eur0(x.cap)} par mois (potentiel calculé : ${eur0(x.capAuto)}).${!blank(x.m.capPct)?'\nLe montant en € est prioritaire sur le pourcentage.':''}`}
    case 'part':{const pr=R.proj[+p[1]],li=pr&&pr.lines[+p[2]],i=+p[3];if(!li)return '';const x=M(i);
      let t;
      t=li.fixed[i]!=null?`Part de ${x.m.name} saisie par vous : ${eur2(li.parts[i])}.`:`Part de ${x.m.name} non saisie : elle compte pour 0 €.`;
      return t+(li.paid[i]?'\nPart payée : elle n’est plus à payer.':`\nReste à payer : ${eur2(li.parts[i])}.`)}
    case 'line':{const pr=R.proj[+p[1]],li=pr&&pr.lines[+p[2]];if(!li)return '';
      let t=`Montant ${eur2(li.amt)} ; somme des parts ${eur2(li.sumParts)}`+(Math.abs(li.gap)<0.5?' : complet.':` ; ${li.gap>0?'il manque':'excédent de'} ${eur2(Math.abs(li.gap))}.`);
      t+=`\nDéjà payé : ${eur2(li.sumParts-li.un)} ; reste à payer : ${eur2(li.un)}.`;
      if(li.level)t+=`\nÉchéance le ${fdate(li.l.date)} (${urgText(li).toLowerCase()}). Clignotement : rouge à 7 jours ou moins ou en retard, orange à 21 jours, jaune jusqu’au délai d’alerte de l’échéance (${li.alertDays} jours).`;
      return t}
    case 'proj':{const pr=R.proj[+p[1]];if(!pr)return '';
      return `Total du projet = somme de ses ${pr.lines.length} dépense(s) = ${eur2(pr.total)}.\nDéjà payé : ${eur2(pr.total-pr.rest)} ; reste à payer : ${eur2(pr.rest)}.\n`+R.mem.map((x,i)=>`${x.m.name} : part ${eur0(pr.parts[i])}, reste ${eur0(pr.unpaid[i])}`).join('\n')}
    case 'rule':{const pr=R.proj[+p[1]];if(!pr)return '';
      return `Information seulement (aucun calcul ni alerte).\nProjet : ${eur0(pr.total)}. Inscription : ${pr.planIdx==null?'non renseignée':idxLabel(pr.planIdx)}. Premier paiement : ${pr.firstIdx==null?'non renseigné':idxLabel(pr.firstIdx)}.`}
    case 'prov':{const pr=R.proj[+p[1]],r=pr&&pr.mres[+p[2]];if(!r)return '';const x=M(p[2]);
      return `${x.m.name} doit encore financer ${eur0(r.need)} sur ce projet (parts non cochées « payé »).\n`+(r.first==null?'Rien à payer pour l’instant.':`À payer en une fois en ${idxLabel(R.start+r.first)} (échéance) : ${eur0(r.tot)}, à part du virement mensuel.`)}
    case 'plan':{const x=M(p[1]),t=+p[2],items=[];
      R.jobs.forEach((j,g)=>{const a=(x.sch.alloc[g]||[])[t];if(a>0.005)items.push(`• ${j.pr.p.name} · ${j.li.l.label} : ${eur2(a)}`)});
      return `À payer par ${x.m.name} en ${idxLabel(R.start+t)} : ${eur2(x.propProv[t])}.\n${items.join('\n')||'Aucune échéance ce mois-ci.'}\nCes parts se règlent en une fois, à part du virement mensuel. Ce qui reste pour les dépenses personnelles ce mois-là : ${eur0(x.netMonth-monthCc(x,R,t)-monthReg(x,R,t)-x.propProv[t])} (repère : ${eur0(x.minNet)}).`}
    case 'reg':{const x=M(p[1]),Y=state.year,rg=R.reg;
      if(rg.mode==='zero')return `${rg.a0} est l\u2019année 0 : régularisation de 0 €.\nElle démarre en ${rg.a0+1}, en comparant ce que ${x.m.name} aura réellement versé en ${rg.a0} à sa part selon les revenus ${rg.a0} déclarés.`;
      if(rg.mode!=='ok')return `Régularisation en attente : ${rg.mode==='missing'?`versements de ${Y-1} non renseignés`:`revenus ${Y-1} non confirmés`}.`;
      const r=x.regRow;return `Versé en ${Y-1} : ${eur2(r.paid)} − régularisation incluse ${eur2(r.applied)} = versé net ${eur2(r.net)}.\nMontant dû = ${pc(x.pct)} (part du revenu réel du foyer ${Y-1}) × charges mensuelles récurrentes de ${Y-1} (${eur2(rg.T)}) = ${eur2(r.dueCc)}, plus la même part des charges non courantes de ${Y-1} (${eur2(rg.NC)}) = ${eur2(r.dueNc)}, soit ${eur2(r.due)} au total.\nÉcart = ${eur2(r.net)} − ${eur2(r.due)} = ${sgn(r.ecart)}.\n${x.regTotal>0.005?`Malus à reverser : ${eur2(x.regTotal)}`:x.regTotal<-0.005?`Bonus déduit : ${eur2(-x.regTotal)}`:'Rien à régulariser'}, lissé sur 12 mois : ${sgn(x.regMonth)} par mois en ${Y}.`}
    case 'net':{const x=M(p[1]),f=x.netInfo;
      if(!blank(x.m.netOverride))return `Net mensuel de ${x.m.name} fixé à la main : ${eur0(x.netMonth)} (estimation automatique : ${eur0(x.netAuto)}).`;
      return `Net estimé de ${x.m.name} par mois :\nrevenu de référence ${eur0(f.base)}${f.dedV+f.abV>0.5?` + déduction forfaitaire et abattement non monétaires ${eur0(f.dedV+f.abV)}`:''}${f.cotis>0.5?`\n− cotisations salariales estimées ${eur0(f.cotis)} (${(x.socRate*100).toLocaleString('fr-FR',{maximumFractionDigits:1})} % du salaire brut de ${eur0(num(x.m.sal))} : retraite, santé, CSG… ; non appliqué au BNC)`:''}\n− impôt estimé ${eur0(f.imp)}\n= ${eur0(x.netAuto*12)} par an, soit ${eur0(x.netAuto)} par mois.\nL’impôt du foyer (${eur0(R.impot)} pour ${R.parts} parts, barème progressif, calculé sur ${eur0(R.sumTaxable)} de revenus imposables avant déductions familiales) est réparti au prorata des revenus imposables de chacun. Pour le BNC, l’abattement et l’URSSAF sont ceux que vous avez saisis. Estimation : saisissez le net réel pour la remplacer.\nCe qui reste après le virement au budget est considéré comme les dépenses personnelles de ${x.m.name}.`}
    case 'capw':{const pr=R.proj[+p[1]];if(!pr||!pr.late)return '';
      return `Ce projet ne peut pas être financé à temps dans les capacités de la famille.\n`+pr.mres.map((r,i)=>r.late?`${R.mem[i].m.name} : ${eur0(r.need)} à financer, ${r.done===Infinity?'impossible':'financé en '+idxLabel(r.done)} pour une échéance en ${idxLabel(r.deadline)}${R.mem[i].hasOv?' avec le plan retenu':''}.`:null).filter(Boolean).join('\n')}
    case 'svdue':{const x=M(p[1]),j=+p[2],k=BM[j],c=x.ccByMonth[k];
      return `${x.m.name}, ${mLab(state.year,j)} :\ncharges mensuelles récurrentes du mois ${eur2(R.ccMonths[k])} × part ${pc(x.pct)} (revenu ${eur0(x.base)} sur ${eur0(R.sumBase)})${Math.abs(c-R.ccMonths[k]*x.pct)>0.005?` ajustée par le plafond de contribution`:''} = ${eur2(c)}\n+ régularisation ${eur2(x.regMonth)}\n= ${eur2(x.dueM[j])} à virer.${x.ncUsed[j]>0.005?`\nÀ part : ${eur2(x.ncUsed[j])} de charges non courantes selon l’échelonnement (hors virement).`:''}\nÀ virer avant le ${virDeadline(yStart(state.year)+j).txt}.`}
    case 'svcum':{const x=M(p[1]),j=+p[2],v=state.suivi[x.m.id]||[];let pd=0,dd=0,ne=0;
      {const jm=janM(x.m.id),ap=num(((state.janApr||{}).applied||{})[x.m.id])/4;jm.forEach((a,k)=>{const due=R.allocAt(state.year*12+k).c[x.ix]+ap;dd+=due;pd+=blank(a)?due:num(a);if(blank(a))ne++})}
      for(let q=0;q<=j;q++){dd+=x.dueM[q];pd+=blank(v[q])?R.effEst(x,q):num(v[q]);if(blank(v[q]))ne++}
      return `Écart cumulé de ${x.m.name} de janvier à ${mLab(state.year,j)} :\npayé ${eur2(pd)} − à payer ${eur2(dd)} = ${sgn(pd-dd)}.\n${ne?`Dont ${ne} mois sans montant réel, comptés à leur montant estimé (en italique).\n`:''}Positif : en avance. Négatif : en retard sur les versements.`}
    case 'svtx':{const x=M(p[1]),n=+p[2],a=(R.tx&&R.tx.a[+p[1]][n])||0,f=(R.tx&&R.tx.f[n])||0;const lab=n<4?MONTHS[n]+' '+state.year:mLab(state.year,n-4);
      return `Taux cumulé de ${x.m.name} de janvier à ${lab} :\nversé pour les charges mensuelles récurrentes ${eur2(a)} (régularisation exclue) ÷ total de la famille ${eur2(f)} = ${f>0.005?pc(a/f):'—'}.\nCible cumulée à cette date : ${pc(R.tx.tg[+p[1]][n])}. Elle suit les taux en vigueur : janvier à avril, le taux du budget précédent (${pc(x.pctPrev)}${x.pctKnown?'':', non enregistré : taux actuel repris'}) ; à partir de mai, le taux du budget en cours (${pc(x.pct)} = revenu de référence ${eur0(x.base)} ÷ ${eur0(R.sumBase)}).\nLes mois sans montant réel utilisent le montant estimé.${Math.abs(x.plafDiff)>0.5?'\nLe plafond de contribution explique l\u2019écart par rapport à la cible.':''}`}
    case 'svcov':{const c=R.cover[+p[1]];if(!c)return '';
      return `${mLab(state.year,c.j)} : charges mensuelles récurrentes de la famille ${eur2(c.cc)}.\nTotal versé par les membres ${eur2(c.paid)}.\n${c.short?`Il manque ${eur2(-c.gap)} pour couvrir les charges mensuelles récurrentes du mois.`:'Les versements couvrent les charges mensuelles récurrentes du mois.'}`}
    case 'owed':{const i=+p[1];return `Somme des parts de ${M(i).m.name} non cochées « payé », tous projets confondus : ${eur2(R.owed[i])}.`}
    case 'syn':{const w=p[1],x=M(p[2]);
      if(w==='close')return `Le budget ${state.year} court du 1er mai ${state.year} au 1er mai ${state.year+1}. À cette date, chacun déclare ses revenus ${state.year}, la régularisation se calcule et l\u2019année est clôturée.`;
      if(w==='pct')return `Part = revenu de référence ${eur0(x.base)} ÷ total de la famille ${eur0(R.sumBase)} = ${pc(x.pct)}.`;
      if(w==='base')return `Revenu de référence ${state.year-1} = revenu total ${eur0(x.total)} (dont non officiels ${eur0(x.nonoffV)}) − déductions ${eur0(x.deds)} = ${eur0(x.base)}.`;
      if(w==='ccY')return Math.abs(x.plafDiff)>0.5?`Charges mensuelles récurrentes de l’année ${eur2(R.T)} × part ${pc(x.pct)} = ${eur2(x.pct*R.T)}.\n${x.plafDiff<0?`Plafond de contribution de ${eur0(x.plaf)} par mois${plafPer(x)} : il verse ${eur2(-x.plafDiff)} de moins sur l’année, couverts par les autres. Cet écart sera régularisé l’an prochain selon ses revenus réels.`:`Il couvre ${eur2(x.plafDiff)} de plus, à cause du plafond de contribution d’un autre membre. Cet écart lui reviendra en bonus l’an prochain si les revenus réels le confirment.`}\nTotal à verser : ${eur2(x.ccYear)}.`:`Charges mensuelles récurrentes de l’année ${eur2(R.T)} × part ${pc(x.pct)} = ${eur2(x.ccYear)}.`;
      if(w==='ccM'){const mo=((R.start%12)+12)%12,c0=monthCc(x,R,0);return `Charges mensuelles récurrentes de ${idxLabel(R.start)} : ${eur2(R.ccMonths[mo])} × part ${pc(x.pct)}${Math.abs(c0-R.ccMonths[mo]*x.pct)>0.005?' (ajustée par le plafond de contribution)':''} = ${eur2(c0)}.\nChaque mois ne compte que ses propres charges, sans lissage. Moyenne annuelle indicative : ${eur2(x.ccMonth)}.`}
      if(w==='prov')return `Charges non courantes pour ${idxLabel(R.start)} : montants à régler à part ce mois-ci, selon l’échelonnement du plan (ils ne sont pas dans le virement). Capacité : ${eur0(x.cap)}.`;
      if(w==='reste'){const c=monthCc(x,R,0),g=monthReg(x,R,0),v=c+g+x.prov[0];return `Net estimé ${eur0(x.netMonth)} − virement du mois ${eur2(c+g)} − charges non courantes à part ${eur2(x.prov[0])} = ${eur0(x.netMonth-v)}.\nCe qui reste sur le compte est considéré comme les dépenses personnelles de ${x.m.name}. Le reste à garder de ${eur0(x.minNet)} sert uniquement aux alertes et aux graphiques, pas aux calculs.`}
      if(w==='virt'){const c=monthCc(x,R,0);return `Virement de ${idxLabel(R.start)} = charges mensuelles récurrentes du mois ${eur2(c)} + régularisation ${eur2(monthReg(x,R,0))} = ${eur2(c+monthReg(x,R,0))}.\nLes charges non courantes (${eur2(x.prov[0])} ce mois-ci) se règlent à part, selon leur échelonnement.\nÀ virer avant le ${virDeadline(R.start).txt}, fin du mois précédent.`}
      return ''}
  }}catch(e){return ''}
  return '';
}

function refresh(){
  const R=compute(state);window.__R=R;
  { // les montants des mois échus sont figés : cocher « payé » plus tard ne réécrit pas l'historique
    state.ncFrozen=state.ncFrozen||{};let ch=false;
    R.mem.forEach(x=>{const f=state.ncFrozen[x.m.id]=state.ncFrozen[x.m.id]||{};
      for(let j=0;j<12;j++)if(yStart(state.year)+j<=NOW_IDX&&f[j]==null){f[j]=Math.round(x.ncByJ[j]*100)/100;ch=true}});
    if(ch)save();
  }
  $('subtitle').textContent=`Budget ${state.year} : calculé sur les revenus ${state.year-1} déclarés en mai ${state.year}`;
  syncAuto(R);
  // Revenus
  if(revView==='next'){const nb=nextBases(),sb=sum(nb.map(b=>b.base));nb.forEach((b,i)=>{setH('o-tot-'+i,eur0(b.total));setH('o-base-'+i,eur0(b.base));setH('o-pct-'+i,pc(sb>0?b.base/sb:1/nb.length))})}
  else R.mem.forEach((x,i)=>{setH('o-net-'+i,`<span data-tipid="net:${i}">${eur0(x.netMonth)}</span>`);setH('o-tot-'+i,eur0(x.total));setH('o-base-'+i,eur0(x.base));setH('o-pct-'+i,pc(x.pct))});
  // Charges mensuelles récurrentes
  state.cc.lines.forEach((l,i)=>setH('o-ccrow-'+i,`<b>${eur0(sum(l.m.map(num)))}</b>`));
  R.ccMonths.forEach((v,k)=>setH('o-ccm-'+k,eur0(v)));setH('o-cct',eur0(R.T));
  const rowsCc=R.mem.map((x,i)=>`<tr><td><span class="dot" style="background:${cvar(i)}"></span> ${esc(x.m.name)}</td><td data-tipid="syn:pct:${i}">${pc(x.pct)}</td><td data-tipid="syn:ccY:${i}">${eur2(x.ccYear)}</td><td data-tipid="syn:ccM:${i}"><b>${eur2(x.ccMonth)}</b></td></tr>`).join('');
  const byMonth=`<details class="fold" open><summary>Cotisation de chaque mois</summary><div class="tw"><table><thead><tr><th>Membre</th>${BM.map(k=>`<th>${MONTHS[k]}</th>`).join('')}</tr></thead><tbody>${R.mem.map(x=>`<tr><td>${esc(x.m.name)}</td>${BM.map(k=>`<td>${eur0(x.ccByMonth[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  setH('cc-split',`<div class="tw"><table><thead><tr><th>Membre</th><th>Part</th><th>Par an</th><th>Moyenne par mois</th></tr></thead><tbody>${rowsCc}</tbody>
    <tfoot><tr><td>Total</td><td>${pc(sum(R.mem.map(x=>x.pct)))}</td><td>${eur2(R.T)}</td><td>${eur2(R.T/12)}</td></tr></tfoot></table></div>${byMonth}`);
  // Capacités
  R.mem.forEach((x,i)=>{
    document.querySelectorAll('.o-seuil').forEach(e=>e.textContent=[...new Set(R.mem.map(x=>x.minNet))].length===1?eur0(R.mem[0].minNet):R.mem.map(x=>x.m.name+' '+eur0(x.minNet)).join(', '));
    setH('o-cnet-'+i,`<span data-tipid="net:${i}">${eur0(x.netMonth)}</span>`);
    setH('o-vir-'+i,`<span data-tipid="capvir:${i}">${eur0(x.virMax)}</span><small class="muted" style="display:block">${idxLabel(R.start+x.virMaxT)}${Math.abs(x.regMax)>0.5?` · dont régul. ${sgn(x.regMax,eur0)}`:''}</small>`);
    setH('o-keep-'+i,`<span data-tipid="capkeep:${i}" class="${x.keepAvg<x.minNet-0.5?'low':''}">${eur0(x.keepAvg)}</span>`);
    setH('o-capa-'+i,`<span data-tipid="cap:${i}"><b>${eur0(x.capAuto)}</b></span>`);
    setH('o-cap-'+i,`<b data-tipid="cap:${i}">${eur0(x.cap)}</b>`)});
  // Projets
  const LV=['cap','late','red','orange','yellow'];
  R.proj.forEach((pr,pi)=>{
    const card=$('proj-'+pi);
    if(card){const lv=pr.late?'cap':pr.level;LV.forEach(c=>card.classList.toggle('u-'+c,lv===c))}
    pr.lines.forEach((li,lj)=>{
      const row=$(`row-${pi}-${lj}`);
      if(row){const lv=li.capLate?'cap':li.level;LV.forEach(c=>row.classList.toggle('u-'+c,lv===c))}
      const ok=Math.abs(li.gap)<0.5;
      let c='';
      if(li.amt)c+=ok?'<span class="chip ok">Complet</span>':`<span class="chip warn">${li.gap>0?'Manque':'Excédent'} ${eur0(Math.abs(li.gap))}</span>`;
      if(li.capLate)c+=' <span class="chip u u-cap">Hors capacité</span>';
      if(li.level)c+=` <span class="chip u u-${li.level}">${urgText(li)}</span>`;
      else if(li.amt&&li.un<=0.005)c+=' <span class="chip plain">Tout payé</span>';
      setH(`lc-${pi}-${lj}`,`<span data-tipid="line:${pi}:${lj}">${c}</span>`);
      {const bl=$(`bell-${pi}-${lj}`),da=$(`dal-${pi}-${lj}`),vis=!(li.amt>0&&li.un<=0.005&&!li.l.remKey);
        if(bl){bl.hidden=!vis;bl.classList.toggle('on',li.alertOn);bl.textContent=li.alertOn?'🔔':'🔕';bl.title=li.alertOn?'Rappel actif : cliquer pour le retirer':'Cliquer pour créer un rappel sur l’iPhone'}
        if(da){if(!blank(li.l.alertDays))da.hidden=false;else if(!da.contains(document.activeElement))da.hidden=true}}
      setH(`la-${pi}-${lj}`,remLineHtml(R,pr,li));

  if(rg.mode==='pending')return `<p class="muted">En attente des revenus ${PY} déclarés : saisissez-les dans « Revenus N-1 » puis confirmez-les. Régularisation : 0 € en attendant.</p>`;
  const cols=R.mem.map((x,i)=>{const r=x.regRow;return {name:x.m.name,color:cvar(i),base:x.base,pct:x.pct,due:r.due,paid:r.net,diff:r.ecart,result:x.regTotal,tip:'reg:'+i,sub:r.applied>0.005||r.applied<-0.005?`${eur2(r.paid)} versés − ${eur2(r.applied)} de régularisation incluse`:''}});
  const fam={base:sum(cols.map(c=>c.base)),due:sum(cols.map(c=>c.due)),paid:sum(cols.map(c=>c.paid)),diff:sum(cols.map(c=>c.diff))};
  return `<p>Charges ${PY} (janvier à décembre) : <b>${eur0(rg.T)}</b> courantes + <b>${eur0(rg.NC)}</b> non courantes = <b>${eur0(rg.T+rg.NC)}</b>.</p>
    ${bilanTable({cols,fam,l:{base:`Revenu de référence ${PY} (déclaré)`,due:'Montant annuel dû (part × charges)',paid:`Montant réellement payé en ${PY}`,monthly:`Effet sur chaque virement ${Y}-${Y+1}`}})}${how}${rg.noT?`<p class="small muted" style="margin-top:6px">Le total des charges mensuelles récurrentes ${PY} n’est pas renseigné : le total versé, moins les charges non courantes, est utilisé à sa place.</p>`:''}`;
}
function renderReg(){

  $reg.innerHTML=`<div class="stack">
    <div class="card"><h2>Régularisation</h2>
      <p>Une fois par an, on vérifie que chacun a payé sa juste part. On prend l’<b>année civile (janvier à décembre)</b>, on répartit les charges de cette année selon le <b>revenu de référence</b> de chacun (connu quand les revenus sont déclarés, en mai suivant), et on compare avec ce que chacun a <b>réellement payé</b>. La différence donne un <span class="chip ok">bonus</span> (trop payé) ou un <span class="chip bad">malus</span> (pas assez), étalé sur les 12 virements suivants.</p></div>

    <div class="card"><h3>Clôturer ${Y} et passer à ${Y+1}</h3>

      <div class="grid3" style="margin:8px 0">${frow('Année concernée',IN('prev.year',{ph:String(Y-1)}))}${frow('Charges mensuelles récurrentes de l’année',IN('prev.charges'))}${frow('Charges non courantes de l’année',IN('prev.ncTotal'))}</div>
      <div class="tw"><table><thead><tr><th>Membre</th><th>Total payé dans l’année (virements + charges non courantes)</th><th>Dont régularisation incluse</th></tr></thead><tbody>${state.members.map((m,i)=>`<tr><td><span class="dot" style="background:${cvar(i)}"></span> ${esc(m.name)}</td>
        <td style="width:200px">${IN(`prev.paid.${m.id}`,{aria:'Total versé '+m.name})}</td><td style="width:200px">${IN(`prev.applied.${m.id}`,{aria:'Régularisation incluse '+m.name})}</td></tr>`).join('')}</tbody></table></div>

}

  {const missJ=R.mem.filter(x=>janTot(x.m.id)==null).map(x=>x.m.name),RN=ensureRevNext(),nowJ2=NOW_IDX-yStart(Y);

   const all=!blankJ.some(a=>a.length)&&!missJ.length&&!!RN.ok;

   const parts=[];

     ${parts.length?`<li class="info">${parts.join(' et ')} : c’est pour ça que la clôture de l’année ${Y} n’est pas encore possible.${!RN.ok?' <button type="button" class="advgo" data-tab="rev">Ouvrir « Revenus N-1 » →</button>':''}</li>`:`<li class="ok">Tout est prêt : vous pouvez clôturer l’année ${Y}.</li>`}</ul>`);}
  const h=(state.hist||[]).slice().reverse();

function renderSyn(R){

  const seg=R.mem.map((x,i)=>`<div class="seg" data-tipid="syn:pct:${i}" style="flex:${Math.max(x.pct,0.001)} 1 0;background:${cvar(i)}"><span class="nm">${esc(x.m.name)}</span><span class="pc">${pc(x.pct)}</span></div>`).join('');
  const cards=R.mem.map((x,i)=>{
    const p0=x.prov[0],cc0=monthCc(x,R,0),rg0=monthReg(x,R,0),virt=cc0+rg0,reste=x.netMonth-virt-p0;
    return `<div class="card mc" style="--c:${cvar(i)}"><h3><span class="dot"></span>${esc(x.m.name)}</h3>
    <dl><dt>Revenu de référence ${state.year-1}</dt><dd data-tipid="syn:base:${i}">${eur0(x.base)}</dd>
    <dt>Charges mensuelles récurrentes par an${Math.abs(x.plafDiff)>0.5?`<small class="muted" style="display:block">${x.plafDiff<0?`plafond ${eur0(x.plaf)} par mois${plafPer(x)}`:'couvre le plafond d’un autre'}</small>`:''}</dt><dd data-tipid="syn:ccY:${i}">${eur2(x.ccYear)}</dd>
    <dt>Charges mensuelles récurrentes de ${idxLabel(R.start)}</dt><dd data-tipid="syn:ccM:${i}">${eur2(cc0)}</dd>
    <dt>Régularisation ${R.reg.mode==='zero'?state.year:state.year-1} (total de l\u2019année)</dt><dd data-tipid="reg:${i}">${R.reg.mode==='ok'?sgn(x.regTotal)+(x.regTotal>0.005?' malus':x.regTotal<-0.005?' bonus':''):eur2(0)}</dd>
    <dt>Charges non courantes à part (premier mois)</dt><dd data-tipid="syn:prov:${i}">${eur2(p0)}</dd>
    <dt>Net estimé par mois</dt><dd data-tipid="net:${i}">${eur0(x.netMonth)}</dd>
    <dt>Reste après virement (dépenses personnelles)</dt><dd class="${reste<x.minNet-0.5?'low':''}" data-tipid="syn:reste:${i}">${eur0(reste)}${reste<x.minNet-0.5?` (à garder : ${eur0(x.minNet)})`:''}</dd></dl>
    <div class="big" data-tipid="syn:virt:${i}"><span>Virement de ${idxLabel(R.start)}<small class="muted" style="display:block">À effectuer avant le ${virDeadline(R.start).txt} (${virWhen(R.start)})</small></span><b>${eur2(virt)}</b></div></div>`}).join('');
  const al=[];
  if(R.close.days<0)al.push(['bad',`La clôture du budget ${state.year} était prévue le 1er mai ${state.year+1} : déclarez les revenus ${state.year} puis clôturez l\u2019année (onglet Régularisation).`]);
  else if(R.close.days<=R.alerte)al.push(['warn',`Clôture du budget ${state.year} le 1er mai ${state.year+1}, dans ${R.close.days} jour(s) : chacun déclare ses revenus ${state.year}, puis on clôture l\u2019année.`]);
  R.mem.forEach(x=>{if(Math.abs(x.plafDiff)>0.5&&x.plafDiff<0)al.push(['info',`${esc(x.m.name)} : plafond de contribution de ${eur0(x.plaf)} par mois${plafPer(x)}. Il verse ${eur0(-x.plafDiff)} de moins sur l’année que sa part (${pc(x.pct)}) ; les autres membres couvrent la différence. L’an prochain, la régularisation tranchera : malus s’il pouvait cotiser davantage, bonus sinon.`])});
  if(R.uncovTotal>0.5)al.push(['bad',`Les plafonds de contribution ne couvrent pas toutes les charges mensuelles récurrentes : il manque ${eur0(R.uncovTotal)} sur l’année.`]);
  suiviMissing(R).forEach(q=>al.push(['warn',`${q.label} : versement attendu le ${q.txt}, non validé comme payé pour ${q.names.map(esc).join(' et ')}. ${alertBtn(q.key)}`]));
  shortList(R).forEach(({c,key})=>al.push(['bad',`${mLab(state.year,c.j)} : les versements saisis (${eur2(c.paid)}) ne couvrent pas les charges mensuelles récurrentes du mois (${eur2(c.cc)}). Il manque ${eur2(-c.gap)}. ${alertBtn(key)}`]));
  {const nm=maskedCount(R);if(nm)al.push(['info',unmaskBtn(nm)])}
  R.cover.filter(c=>c.shortNc).forEach(c=>al.push(['warn',`${mLab(state.year,c.j)} : les charges mensuelles récurrentes sont couvertes mais pas les charges non courantes (versé ${eur2(c.paid)} pour ${eur2(c.need)} à payer, il manque ${eur2(-c.gapNc)}).`]));
  R.mem.forEach(x=>{if(x.over.length)al.push(['bad',`${esc(x.m.name)} : avec les charges non courantes à verser, le reste sur le compte passe sous le repère de ${eur0(x.minNet)} en ${idxLabel(R.start+x.over[0])}${x.over.length>1?` et ${x.over.length-1} autre(s) mois`:''}.`])});

  if((state.revYear==null?state.year-1:state.revYear)!==state.year-1)al.push(['warn',`Les revenus saisis ne sont pas ceux de ${state.year-1} : mettez-les à jour dans « Revenus N-1 ».`]);
  R.proj.forEach(pr=>{
    const nm='« '+esc(pr.p.name)+' »';
    pr.lines.forEach(li=>{
      if(li.amt&&Math.abs(li.gap)>=0.5)al.push(['warn',`${nm}, ${esc(li.l.label)} : les parts font ${eur0(li.sumParts)} pour ${eur0(li.amt)} de dépense.`]);
      if(li.amt&&li.days==null)al.push(['info',`${nm}, ${esc(li.l.label)} : date de paiement à renseigner.`]);

  const alerts=al.length?al.map(a=>`<li class="${a[0]}">${a[1]}</li>`).join(''):'<li class="ok">Rien à signaler : toutes les règles sont respectées.</li>';
  const dues=R.due.length?`<div class="card"><h3>Échéances à surveiller</h3><p class="small muted">Dépenses non payées dont la date approche (alerte définie échéance par échéance).</p>
    <ul class="dues">${R.due.map(d=>`<li class="u-${d.li.level}"><span class="chip u u-${d.li.level}">${urgText(d.li)}</span><span><b>${esc(d.pr.p.name)}</b>, ${esc(d.li.l.label)}, ${fdate(d.li.l.date)}. Reste à payer : ${R.mem.map((x,i)=>d.li.unpaid[i]>0.005?`${esc(x.m.name)} ${eur0(d.li.unpaid[i])}`:null).filter(Boolean).join(', ')}.</span></li>`).join('')}</ul></div>`:'';
  const capCard=R.capProj.length?`<div class="card capalert u-cap"><h3><span class="chip u u-cap">Hors capacité</span> Projets dont une part dépasse ce qui reste sur le compte</h3>
    <p class="small muted">Repère : ce qui reste sur le compte de chacun après son virement sert à ses dépenses personnelles ; tout ce qui dépasse le reste à garder de chacun (défini dans la Synthèse) est le potentiel pour les charges non courantes.</p>
    <ul class="dues">${R.capProj.map(pr=>`<li class="u-cap"><span><b>${esc(pr.p.name)}</b> : ${pr.mres.map((r,i)=>r.late?`${esc(R.mem[i].m.name)} doit payer ${eur0(r.need)}, ce qui dépasse ce qui lui reste en ${idxLabel(r.deadline)} après son virement, au-delà de son reste à garder`:null).filter(Boolean).join(' ; ')}.Repoussez la date, réduisez le montant ou modifiez les parts.</span></li>`).join('')}</ul></div>`:'';
  const nrows=Math.min(12,R.H);
  const mt=[...Array(nrows)].map((_,t)=>{const v=first(t);return `<tr><td>${idxLabel(R.start+t)}${R.start+t>=yStart(state.year)+12?`<small class="muted" style="display:block">budget ${state.year+1} : estimation</small>`:''}</td><td>${virDeadline(R.start+t).txt}</td>${v.map((a,i)=>`<td class="cell2" data-tipid="plan:${i}:${t}"><b>${eur0(a)}</b><small>+ ${eur0(R.mem[i].prov[t])} à part${Math.abs(monthReg(R.mem[i],R,t))>0.005?`, dont régul. ${sgn(monthReg(R.mem[i],R,t),eur0)}`:''}</small><small class="${R.mem[i].netMonth-a-R.mem[i].prov[t]<R.mem[i].minNet-0.5?'low':''}">garde ${eur0(R.mem[i].netMonth-a-R.mem[i].prov[t])}</small></td>`).join('')}<td>${eur0(sum(v))}</td></tr>`}).join('');
  const rest=R.mem.map((x,i)=>{const nx=R.next[i];
    return `<tr><td><span class="dot" style="background:${cvar(i)}"></span> ${esc(x.m.name)}</td><td data-tipid="owed:${i}"><b>${eur0(R.owed[i])}</b></td><td>${R.overdue[i]>0.005?`<span class="chip bad">${eur0(R.overdue[i])}</span>`:'—'}</td>

  const fa=document.activeElement,keepOld=!!(fa&&fa.closest&&fa.closest('#syn-keep')&&$syn.contains(fa)); // l’input en cours de saisie n’est pas reconstruit (le curseur reste en place)
  const synHtml=`<div class="stack">

const VIEWS=[];let statsBuilt=false;

/* ============ Ajustements et anticipation ============ */
function adjTrend(vals,ref){
  const n=vals.length;if(n<2)return null;
  const mean=a=>a.reduce((p,q)=>p+q,0)/a.length,k=Math.min(3,Math.floor(n/2));
  const last=mean(vals.slice(-k)),prev=mean(vals.slice(-2*k,-k)),d=last-prev,tol=Math.max(10,ref*0.015);
  return {k,last,prev,d,dir:Math.abs(d)<tol?0:d>0?1:-1};
}
function adjAnalysis(R){
  const Y=state.year,nowJ=NOW_IDX-yStart(Y);
  const per=R.mem.map(x=>{
    const v=state.suivi[x.m.id]||[],e=(state.est&&state.est[x.m.id])||[];
    const ref=sum(x.dueM)/12,tol=Math.max(10,ref*0.015);
    const real=[],man=[];
    for(let j=0;j<12;j++){
      const calc=x.dueM[j];
      if(!blank(v[j]))real.push({j,calc,val:num(v[j]),adj:num(v[j])-calc});
      else if(!blank(e[j]))man.push({j,calc,val:num(e[j]),adj:num(e[j])-calc});
    }
    const adjs=real.map(a=>a.adj),ups=real.filter(a=>a.adj>tol),downs=real.filter(a=>a.adj<-tol);
    return {x,ref,tol,real,man,mean:adjs.length?sum(adjs)/adjs.length:0,trend:adjTrend(adjs,ref),ups,downs,
      upTot:sum(ups.map(a=>a.adj)),downTot:sum(downs.map(a=>a.adj)),manTot:sum(man.map(a=>a.adj)),manUps:man.filter(a=>a.adj>tol)}
  });
  const hist=(state.adjHist||[]).filter(h=>h.y===Y&&R.mem.some(x=>x.m.id===h.id));
  const dl=hist.map(h=>h.to-h.from),refF=sum(per.map(q=>q.ref))/Math.max(1,per.length);
  return {per,hist,hUps:hist.filter(h=>h.to-h.from>0.5),hDowns:hist.filter(h=>h.to-h.from<-0.5),hTrend:adjTrend(dl,refF),nowJ};
}

  });

    <div class="tw"><table><thead><tr><th>Date</th><th>Par</th><th>Membre</th><th>Mois</th><th>Avant</th><th>Après</th><th>Ajustement</th></tr></thead><tbody>${H.slice(-12).reverse().map(h=>{const d=h.to-h.from,m=mem.find(x=>x.m.id===h.id);

    ${chart}${hs}

function buildAdvice(c){

  const nm=x=>esc(x.m.name);

  R.proj.forEach(pr=>{
  });

      +` Pistes : repousser le paiement${isFinite(pr.completion)?` à ${idxLong(pr.completion)}`:''}, réduire le montant, ou rééquilibrer les parts${free&&free.s>0?` (${nm(free.x)} dispose de la plus grande marge, ${eur0(free.s)} par mois)`:''}.`,'projets');
  });
  const urgent=R.due.filter(d=>['late','red'].includes(d.li.level));
  if(urgent.length)add(3,`${urgent.length} échéance${urgent.length>1?'s':''} à payer en priorité`,urgent.slice(0,4).map(d=>`« ${esc(d.li.l.label)} » (${esc(d.pr.p.name)}) : ${eur0(d.li.un)} ${d.li.days<0?`en retard de ${-d.li.days} j`:`dans ${d.li.days} j`}`).join(' ; ')+'.','projets');
  const soon=R.due.filter(d=>d.li.level==='orange');
  if(soon.length)add(2,`${soon.length} échéance${soon.length>1?'s':''} d’ici trois semaines`,soon.slice(0,4).map(d=>`« ${esc(d.li.l.label)} » : ${eur0(d.li.un)} le ${fdate(d.li.l.date)}`).join(' ; ')+'. Vérifiez que la provision est bien en place.','projets');
  // 2. marge sur le compte
  mem.forEach((x,i)=>{
    const minNet=x.minNet,ks=c.keep[i],low=ks.map((v,t)=>v<minNet-.5?t:-1).filter(t=>t>=0);
    if(low.length)add(3,`${nm(x)} passe sous ${eur0(minNet)} sur son compte`,`Mois concernés : ${low.slice(0,5).map(t=>c.labT[t]+' ('+eur0(ks[t])+')').join(', ')}${low.length>5?` et ${low.length-5} autre(s)`:''}. Ce reste sert aux dépenses personnelles de chacun. Pistes : décaler la date d’une charge non courante, réduire les charges ou revoir le repère de reste minimal dans l’onglet Revenus N-1.`,'synthese');
    else{

      if(m<minNet+ADV.margeSerree)add(2,`Marge serrée pour ${nm(x)}`,`Son plus petit reste sur le compte est de ${eur0(m)}, à ${eur0(m-minNet)} seulement du repère de ${eur0(minNet)} : un imprévu suffit à passer dessous.`);
      else if(x.netMonth>0&&m-minNet>ADV.margeConf*x.netMonth)add(1,`${nm(x)} a une marge confortable`,`Son plus petit reste après virement est de ${eur0(m)}, soit ${eur0(m-minNet)} au-dessus du repère de ${eur0(minNet)}. Cette marge permet d’absorber une charge non courante les mois où elle tombe, ou de constituer un coussin de sécurité.`);
    }

  // 4. postes de charges
  const lines=S.cc.lines.map(l=>({l:l.label||'Sans nom',t:sum(l.m.map(num))})).filter(q=>q.t>0).sort((a,b)=>b.t-a.t);
  if(R.T>0&&lines.length){
    const fx=sum(lines.filter(q=>['credit','assur','fixe'].includes(kindOf(q.l))).map(q=>q.t)),sp=lines.filter(q=>q.t/R.T>=ADV.partMin).slice(0,3);

  }

      add(ad.hUps.length>=2?2:1,`${ad.hUps.length} montant${ad.hUps.length>1?'s':''} à venir augmenté${ad.hUps.length>1?'s':''} à la main (${sgn(tot,eur0)} au total)`,`Chaque hausse en cours de route signale une charge qui n’avait pas été anticipée. En moyenne, l’ajustement est de ${sgn(tot/ad.hUps.length,eur0)} à chaque fois${ad.hTrend&&ad.hTrend.dir>0?', et il augmente : les surprises deviennent plus importantes':ad.hTrend&&ad.hTrend.dir<0?', et il diminue : l’anticipation s’améliore':''}. Ajoutez ces charges dans les charges mensuelles récurrentes ou comme projets dès qu’elles sont connues.`,'suivi')}
    ad.per.forEach(q=>{const nm=esc(q.x.m.name),t=q.trend;

  Object.keys(hm).forEach(k=>{const y=+k.slice(1);if(!isFinite(y)||y>=Y||!hm[k])return;const a=hm[k][kind]||[];
    if(!a.some(x=>!blank(x)))return;out.push({y,v:[...Array(12)].map((_,j)=>blank(a[j])?0:num(a[j]))})});

function seasonHTML(id,W,o){

/* ============ Historique des versions ============ */
// Chaque modification est conservée sous forme de différences (avant / après) : on peut revenir à n’importe quelle version.
const VER_MAX=400;const undoPend={};
const snap=()=>{const {log,users,versions,...rest}=state;return JSON.stringify(rest)};
const verClone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
function verDiff(a,b,path,out){
  if(a===b)return;
  const oa=a!==null&&typeof a==='object',ob=b!==null&&typeof b==='object';
  if(oa&&ob&&Array.isArray(a)===Array.isArray(b)){
    if(Array.isArray(a)){
      if(a.length!==b.length){out.push({p:path,o:a,n:b});return}
      a.forEach((v,i)=>verDiff(v,b[i],path.concat(String(i)),out));return}
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{
      if(!(k in a))out.push({p:path.concat(k),ou:1,n:b[k]});
      else if(!(k in b))out.push({p:path.concat(k),o:a[k],nu:1});
      else verDiff(a[k],b[k],path.concat(k),out)});
    return}
  out.push({p:path,o:a,n:b});
}
function verPush(e){
  state.versions=state.versions||[];
  e.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);e.t=new Date().toISOString();e.u=me||'?';
  state.versions.push(e);
  while(state.versions.length>VER_MAX)state.versions.shift();
  if(curTab==='hist')renderHist();
}
function recordVersion(before,label){
  if(!me)return;
  let ch=[];
  try{verDiff(JSON.parse(before),JSON.parse(snap()),[],ch)}catch(e){return}
  ch=ch.filter(c=>c.p[0]!=='sim'&&c.p[0]!=='remDel');
  if(!ch.length)return;
  ch.slice(0,12).forEach(c=>{try{c.l=describe(c.p.join('.'))}catch(e){}});
  const e={a:(label||'Modification').slice(0,160),ch};
  if(JSON.stringify(ch).length>150000){e.ch=[];e.nr=1;e.big=ch.length} // trop volumineux : modification conservée mais sans retour possible avant elle
  verPush(e);
}
function pushUndo(before,label){recordVersion(before,label)}
function verApplyRev(root,c){
  let o=root;for(let i=0;i<c.p.length-1;i++){o=o[c.p[i]];if(o==null)return}
  const k=c.p[c.p.length-1];
  if(!c.p.length)return;
  if(c.ou)delete o[k];else o[k]=verClone(c.o);
}
// état juste après l’entrée d’indice k (k = -1 : avant la toute première entrée), ou null si impossible
function verStateAfter(k){
  const V=state.versions||[],cur=JSON.parse(snap());
  for(let i=V.length-1;i>k;i--){const e=V[i];if(e.nr)return null;for(let c=e.ch.length-1;c>=0;c--)verApplyRev(cur,e.ch[c])}
  return cur;
}
function restoreVersion(id,mode){
  if(!me)return;
  const V=state.versions||[],k=V.findIndex(e=>e.id===id);if(k<0)return;
  const e=V[k],target=verStateAfter(mode==='before'?k-1:k);
  if(!target){alert('Cette version ne peut plus être récupérée : une modification trop volumineuse s’est produite depuis.');return}
  const lab=mode==='before'?`avant « ${e.a} » (${fdt(e.t)})`:`« ${e.a} » (${fdt(e.t)})`;
  if(!confirm(`Récupérer la version ${lab} ?\n\nL’état actuel reste dans l’historique : vous pourrez le récupérer à son tour.`))return;
  const bf=snap();
  Object.keys(state).forEach(q=>{if(q!=='log'&&q!=='users'&&q!=='versions')delete state[q]});
  Object.assign(state,target);
  for(const q in pend)delete pend[q];for(const q in undoPend)delete undoPend[q];
  ensureAccounts();
  const msg='Récupération de la version '+lab;
  addLog(msg);recordVersion(bf,msg);renderAll();save();
}
function verFmt(v,u){
  if(u)return '(absent)';
  if(v!==null&&typeof v==='object')return Array.isArray(v)?`${v.length} élément${v.length>1?'s':''}`:'(groupe de valeurs)';

}
let histAll=false;
function renderHist(){
  if(!$hist)return;
  if(!me){$hist.innerHTML='';return}
  const V=state.versions||[];
  // fichier d’enregistrement de chaque version + possibilité de retour
  const n=V.length,file=Array(n),canAt=Array(n+1);let nextFile='',nr=false;
  for(let k=n-1;k>=0;k--){const e=V[k];if(e.file)nextFile=e.file;file[k]=e.file||nextFile;canAt[k+1]=!nr;if(e.nr)nr=true}
  canAt[0]=!nr;
