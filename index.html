  const lines=(e,key)=>{
    if(!e.ch||!e.ch.length)return '';
    const L=e.ch.slice(0,4).map(c=>{const u=key==='o'?c.ou:c.nu,v=key==='o'?c.o:c.n;return `<div class="hl"><span class="muted">${esc(c.l||c.p.join(' › '))}</span> : <b>${esc(verFmt(v,u))}</b></div>`}).join('');
    return L+(e.ch.length>4?`<div class="hl muted">… et ${e.ch.length-4} autre${e.ch.length-4>1?'s':''}</div>`:'');
  };
  const isLatestState=k=>V.slice(k+1).every(x=>!x.ch||!x.ch.length);
  const btn=({e,k})=>{
    if(e.file){const cur=isLatestState(k);return cur?'<span class="chip ok">Version actuelle</span>':canAt[k+1]?`<button class="btn small" data-act="verRestore" data-v="${e.id}" data-m="at">Récupérer</button>`:'<span class="muted small">indisponible</span>'}
    return canAt[k]?`<button class="btn small" data-act="verRestore" data-v="${e.id}" data-m="before" title="Revenir à l’état d’avant cette modification">Récupérer l’avant</button>`:'<span class="muted small">indisponible</span>';
  };
  $hist.innerHTML=`<div class="stack"><div class="card"><h2>Historique des versions</h2>
    <p>Chaque modification est conservée avec la personne qui l’a faite, la valeur d’avant et celle d’après. Chaque enregistrement ou ouverture de fichier est aussi noté avec son nom. « Récupérer » remet l’application dans l’état de la ligne choisie ; rien n’est effacé : l’état que vous quittez reste dans l’historique.</p>
    ${rows.length?`<div class="tw"><table class="logtable histtable"><thead><tr><th>Date et heure</th><th>Qui</th><th>Fichier</th><th>Modification</th><th>Avant</th><th>Après</th><th></th></tr></thead><tbody>${
      shown.map(r=>{const e=r.e;return `<tr${e.file?' class="hsave"':''}><td class="t">${fdt(e.t)}</td><td><b>${esc(e.u)}</b></td><td>${file[r.k]?esc(file[r.k]):'<span class="muted">non enregistré</span>'}</td><td>${esc(e.a)}${e.big?` <span class="muted small">(${e.big} valeurs modifiées)</span>`:''}</td><td>${lines(e,'o')}</td><td>${lines(e,'n')}</td><td style="white-space:nowrap">${btn(r)}</td></tr>`}).join('')}</tbody></table></div>
    <p class="small muted" style="margin-top:8px">${rows.length} ligne(s)${rows.length>shown.length?` : ${shown.length} affichées. <button class="btn small" data-act="histAll">Tout afficher</button>`:''}. Seules les ${VER_MAX} dernières modifications sont conservées.</p>`:'<p class="muted">Aucune modification enregistrée pour le moment.</p>'}
  </div>
  ${profilsHtml()}
  ${cloudHtml()}</div>`;

function migrateProjects(){
  // ancien format : montants payés par personne, mensualités. Nouveau : parts par personne, case « payé », une échéance par ligne.
  const startIdx=NOW_IDX+1;
  let changed=false;
  state.projects.forEach(p=>{
    delete p.split;delete p.commit;
    const out=[];
    (p.lines||[]).forEach(l=>{
      const isOld=('n' in l)||(l.paid&&Object.values(l.paid).some(v=>typeof v==='number'));
      if(!isOld){out.push(l);return}
      changed=true;
      const op=l.paid||{};
      const hasM=state.members.some(m=>num(op[m.id])>0);
      const mkParts=()=>{const o={};if(hasM)state.members.forEach(m=>{o[m.id]=num(op[m.id])});return o};
      const di=ymIdx((l.date||'').slice(0,7));
      const past=di!=null&&di<startIdx;
      const paidAll=past;
      const n=Math.max(1,Math.round(num(l.n))||1);
      for(let k=0;k<n;k++){
        const paid={};if(paidAll)state.members.forEach(m=>{paid[m.id]=true});
        let date=l.date;
        if(k>0&&l.date){const [y,mo,d]=l.date.split('-').map(Number);const dt=new Date(y,mo-1+k,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();date=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}
        out.push({id:k?uid():l.id,label:n>1?`${l.label} (${k+1}/${n})`:l.label,date,amount:n>1?Math.round(num(l.amount)/n*100)/100:l.amount,parts:hasM&&n===1?mkParts():{},paid});
      }
    });
    p.lines=out;
  });
  return changed;
}

const versionsCutoff=(now=new Date())=>new Date(now.getFullYear()-1,0,1).getTime();
async function firebaseApi(cfg){
  const B=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);

    user:()=>new Promise(res=>{const u=Au.onAuthStateChanged(auth,x=>{u();res(x)})}),
    signIn:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),
    signOut:()=>Au.signOut(auth),
    read:async()=>{const sn=await F.getDoc(ref);return sn.exists()?sn.data():null},
    write:(exp,payload)=>F.runTransaction(db,async tx=>{const sn=await tx.get(ref);const r=sn.exists()?(sn.data().rev||0):0;

    saveVersion:async p=>{

async function cloudPack(j){

async function cloudUnpack(t){

function cloudErr(e){

async function cloudApply(remote){

async function cloudPush(force){
  if(!cloud.ok||!cloud.api||cloud.pushing)return;
  cloud.pushing=true;
  try{
    const j=JSON.stringify(state),data=await cloudPack(j),payload=()=>({data,by:me||'—',t:Date.now(),cid:cloud.cid,v:state.v});
    let r;
    try{r=await cloud.api.write(cloud.rev,payload())}
    catch(e){
      if(!e||!e.conflict)throw e;
      const rm=e.remote;
      if(!force&&rm&&confirm(`Les données ont été modifiées ailleurs (par ${rm.by||'?'}, le ${new Date(rm.t||0).toLocaleString('fr-FR')}).\n\nOK : charger la version du cloud (vos dernières modifications sur cet appareil seront perdues).\nAnnuler : remplacer le cloud par votre version.`)){await cloudApply(rm);return}
      r=await cloud.api.write(rm?rm.rev:0,payload());

async function cloudSync(){
  const r=await cloud.api.read();

  const who=`${r.by||'?'}, le ${new Date(r.t||0).toLocaleString('fr-FR')}`;
  if(cloud.rev===0&&FRESH_LOCAL){await cloudApply(r);return}
  if(cloud.rev===0){
    if(confirm(`Des données existent déjà dans le cloud (dernière modification par ${who}).\n\nOK : les charger sur cet appareil (les données de cet appareil seront remplacées).\nAnnuler : envoyer les données de cet appareil à la place.`))await cloudApply(r);

  }

    if(cloud.dirty&&!confirm(`Le cloud contient une version plus récente (${who}), et cet appareil a des modifications non envoyées.\n\nOK : charger la version du cloud (modifications locales perdues).\nAnnuler : envoyer votre version.`)){cloud.rev=r.rev||0;await cloudPush(true)}

async function cloudConnect(pw){
  cloud.err='';cloud.status='wait';

  try{
    const j=JSON.stringify(state),data=await cloudPack(j);
    await cloud.api.saveVersion({name,by:me||'—',t:Date.now(),data,year:state.year,v:state.v});
    if(!quiet){cloudFlash('☁ version « '+name+' » enregistrée');cloudMark(JSON.stringify(state))}
    return true;
  }catch(e){cloud.err=cloudErr(e);if(!quiet)alert('Enregistrement impossible : '+cloud.err);cloudInd();return false}
}
const cloudNeedMsg=()=>cloud.cfg?'Hors ligne : l’enregistrement et le chargement dans la base seront possibles dès le retour de la connexion.':'Connectez d’abord l’outil à la base (onglet Historique et accès, bloc Synchronisation Firebase).';
function closeDlg(){const m=document.getElementById('dlg');if(m)m.remove()}
async function cloudVersionsDialog(){
  closeDlg();
  const m=document.createElement('div');m.className='modal';m.id='dlg';
  m.innerHTML='<div class="box" role="dialog" aria-label="Versions enregistrées"><h3>Charger une version</h3><p class="small muted">Chargement de la liste…</p></div>';
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)closeDlg()});
  const box=m.firstChild;
  try{
    const cut=versionsCutoff(),list=(await cloud.api.listVersions(500)).filter(v=>(v.t||0)>=cut);
    box.innerHTML=`<h3>Charger une version</h3><p class="small muted">Versions enregistrées dans la base, de la plus récente à la plus ancienne (seules les versions de l’année en cours et de l’année précédente sont conservées). Charger une version remplace les données actuelles ; une copie des données actuelles est enregistrée juste avant.</p>
      ${list.length?list.map(v=>`<div class="vrow"><span><b>${esc(v.name||'(sans nom)')}</b><small class="muted">${esc(v.by||'—')} · ${fdt(new Date(v.t||0).toISOString())} · budget ${esc(v.year)}</small></span><button type="button" class="btn small primary" data-act="loadVer" data-id="${esc(v.id)}">Charger</button></div>`).join(''):'<p class="muted">Aucune version enregistrée : utilisez « Enregistrer » pour en créer une.</p>'}
      <div class="actions" style="margin-top:12px"><button type="button" class="btn" data-act="closeDlg">Fermer</button></div>`;
  }catch(e){box.innerHTML=`<h3>Charger une version</h3><p class="small" style="color:var(--bad)">${esc(cloudErr(e))}</p><div class="actions"><button type="button" class="btn" data-act="closeDlg">Fermer</button></div>`}
}
async function cloudLoadVersion(id){
  try{
    const v=await cloud.api.getVersion(id);if(!v)throw new Error('Version introuvable');
    if(!confirm(`Charger la version « ${v.name||''} » (${v.by||'?'}, ${new Date(v.t||0).toLocaleString('fr-FR')}) ?\n\nLes données actuelles seront remplacées. Une copie des données actuelles est enregistrée juste avant.`))return;
    await cloudSaveVersion('Avant chargement de « '+(v.name||'')+' » ('+new Date().toLocaleString('fr-FR')+')',true);
    closeDlg();
    await cloudApply({data:v.data,rev:cloud.rev});
    addLog('Chargement de la version « '+(v.name||'')+' »');verPush({a:'Chargement de la version',file:v.name||'',ch:[]});
    cloud.dirty=true;cloud.serial=null;await cloudPush(true);cloudFlash('☁ version « '+(v.name||'')+' » chargée');
    if(me)renderAll();
  }catch(e){alert('Chargement impossible : '+cloudErr(e))}
}
function cloudHtml(){
  const rules="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /familles/{doc=**} {\n      allow read, write: if request.auth != null;\n    }\n  }\n}";
  const st={ok:'Connecté',wait:'Connexion en cours…',offline:'Hors ligne',auth:'Reconnexion requise',error:'Erreur',off:'Non configuré'}[cloud.status]||'—';
  const form=`<form id="f-cloud" class="uform" style="margin-top:10px;max-width:520px">
      <label>Configuration Firebase (collez l’objet firebaseConfig)<textarea class="in" id="cl-cfg" rows="5" placeholder='{ apiKey: "…", authDomain: "…", projectId: "…", appId: "…" }' autocomplete="off" spellcheck="false">${esc(JSON.stringify(cloud.cfg||FB_DEFAULT_CFG,null,1))}</textarea></label>
      <label>E-mail de la connexion famille<input class="in" id="cl-mail" type="email" autocomplete="username" required value="${esc(cloud.email||'')}"></label>
      <label>Mot de passe de la connexion famille<input class="in" id="cl-pw" type="password" autocomplete="current-password" required></label>
      <div><button class="btn primary" type="submit">${cloud.cfg?'Se reconnecter':'Se connecter et synchroniser'}</button></div></form>`;
  return `<div class="card"><h2>Synchronisation Firebase</h2>
    <p class="small muted">Les données de tous les profils sont enregistrées dans votre base Firebase et mises à jour sur chaque appareil. Une seule connexion Firebase est partagée par la famille ; les profils ci-dessus servent à savoir qui modifie.</p>
    <p><span class="chip ${cloud.status==='ok'?'ok':cloud.cfg?'warn':'plain'}">${st}</span>
      ${cloud.cfg?` projet <b>${esc(cloud.cfg.projectId)}</b>${cloud.last?` · dernière synchronisation ${new Date(cloud.last).toLocaleString('fr-FR')}`:''} · version ${cloud.rev}${cloud.dirty?' · modifications en attente d’envoi':''}`:''}</p>
    ${cloud.err?`<p class="small" style="color:var(--bad)" role="alert">${esc(cloud.err)}</p>`:''}
    ${cloud.cfg&&cloud.ok?`<div class="actions"><button class="btn" data-act="cloudNow">Synchroniser maintenant</button><button class="btn ghost danger" data-act="cloudOff">Se déconnecter du cloud</button></div>`:form}
    <details class="fold" style="margin-top:10px"><summary>Mise en place dans Firebase</summary>
      <ol class="small" style="padding-left:1.1rem;display:grid;gap:4px">
        <li>Console Firebase : créez un projet, puis ajoutez une app Web (icône « &lt;/&gt; ») et copiez l’objet <code>firebaseConfig</code>.</li>
        <li>Build, Firestore Database : créez la base (région Europe, mode production).</li>
        <li>Build, Authentication : activez « E-mail/Mot de passe », puis ajoutez un utilisateur (l’e-mail et le mot de passe de la famille). Dans Settings, Authorized domains, ajoutez le domaine du site (votre-pseudo.github.io).</li>
        <li>Firestore, onglet Règles : collez ces règles et publiez.</li></ol>
      <pre class="small" style="white-space:pre-wrap;user-select:all;background:var(--surface-2,#0001);padding:8px;border-radius:8px">${esc(rules)}</pre></details></div>`;
}

/* ============ Explications au survol ============ */
const tipbox=$('tipbox');let tipTimer=0,tipEl=null;
function showTip(el){
  const id=el.dataset.tipid;const txt=id?tipText(id):el.dataset.tip;if(!txt)return;
  tipEl=el;tipbox.textContent=txt;tipbox.hidden=false;
  const r=el.getBoundingClientRect(),w=tipbox.offsetWidth,h=tipbox.offsetHeight;
  let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(x,window.innerWidth-w-8));
  let y=r.top-h-8;if(y<8)y=r.bottom+8;
  tipbox.style.left=x+'px';tipbox.style.top=y+'px';
}
function hideTip(){clearTimeout(tipTimer);tipbox.hidden=true;tipEl=null}
const tipTarget=e=>e.target.closest&&e.target.closest('[data-tipid],[data-tip]');
document.addEventListener('mouseover',e=>{const el=tipTarget(e);if(!el||el===tipEl)return;clearTimeout(tipTimer);tipTimer=setTimeout(()=>showTip(el),350)});
document.addEventListener('mouseout',e=>{if(tipTarget(e))hideTip()});
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList&&(t.classList.contains('tip')||t.matches('input'))){const el=tipTarget(e);if(el)showTip(el)}});
document.addEventListener('focusout',e=>{if(tipTarget(e))hideTip()});
document.addEventListener('click',e=>{const el=tipTarget(e);if(el&&el.classList.contains('tip')){tipEl===el?hideTip():showTip(el);return}if(!el)hideTip()});
window.addEventListener('scroll',hideTip,{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});

async function boot(){
  state.users=state.users||[];state.log=state.log||[];
  await cloudBoot();
  state.cc.mode='detail';state.cc.lissage=false;
  await ensureAccounts();
  let s=null;try{s=sessionStorage.getItem('cf-me')}catch(e){}
  if(s&&state.users.some(u=>u.pseudo===s)){me=s;enter()}
  else lock();
}
boot();
